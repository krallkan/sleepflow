name: KPSS Hap APK

on:
  push:
    paths:
      - 'kpss-hap/**'
      - '!kpss-hap/*.apk'
      - '.github/workflows/kpss-hap-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kpss-hap
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Pick newest stable platform
        id: sdk
        run: |
          # ubuntu-latest ships the Android SDK; use its cmdline-tools directly.
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          API=$("$SDKM" --list 2>/dev/null | grep -oE 'platforms;android-[0-9]+ ' | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "Newest stable platform: android-$API"
          "$SDKM" --install "platforms;android-$API" > /dev/null
          echo "api=$API" >> "$GITHUB_OUTPUT"

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace -PcompileSdk=${{ steps.sdk.outputs.api }}

      - name: Verify APKs
        run: |
          set -e
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            unzip -l "$apk" | grep 'assets/index.html'
            unzip -p "$apk" assets/index.html | cmp - app/src/main/assets/index.html
            echo "assets/index.html is byte-identical"
            "$AAPT" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label):"
          done
          "$(dirname "$AAPT")/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Collect APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk KPSS-Hap.apk
          cp app/build/outputs/apk/debug/app-debug.apk KPSS-Hap-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KPSS-Hap-apk
          path: |
            kpss-hap/KPSS-Hap.apk
            kpss-hap/KPSS-Hap-debug.apk

      - name: Commit APKs back to the branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f KPSS-Hap.apk KPSS-Hap-debug.apk
          git diff --cached --quiet && exit 0
          git commit -m "KPSS Hap: build APK (${GITHUB_SHA::7}) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
