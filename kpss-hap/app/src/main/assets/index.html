["V","Yasama","CIKAR","TBMM ve Cumhurbaşkanlığı seçimleri kaç yılda bir yapılır?","5|4|6|7|3","2017 değişikliğiyle iki seçim aynı günde ve 5 yılda bir yapılır."],
["V","Yürütme","COK","Cumhurbaşkanı seçilebilmek için gereken en düşük yaş kaçtır?","40|35|30|45|25","Şartlar: 40 yaşını doldurmuş, yükseköğrenim yapmış ve milletvekili seçilme yeterliliğine sahip Türk vatandaşı olmak."],
["V","Yürütme","CIKTI","Bir kişi en fazla kaç kez Cumhurbaşkanı seçilebilir?","İki kez|Bir kez|Üç kez|Sınır yoktur|Dört kez","Görev süresi 5 yıldır ve kişi en fazla iki kez seçilebilir. İkinci dönemde TBMM seçimleri yenilerse bir kez daha aday olabilir."],
["V","Yürütme","CIKAR","Olağanüstü hal ilan etme yetkisi kime aittir?","Cumhurbaşkanı|TBMM Başkanı|Millî Güvenlik Kurulu|İçişleri Bakanı|Anayasa Mahkemesi","Cumhurbaşkanı en fazla 6 ay süreyle OHAL ilan edebilir; karar Resmî Gazete'de yayımlanır ve aynı gün TBMM onayına sunulur."],
["V","Yargı","COK","Anayasa Mahkemesi kaç üyeden oluşur?","15|11|17|13|21","15 üyenin 3'ünü TBMM, 12'sini Cumhurbaşkanı seçer. Üyeler 12 yıl için seçilir ve bir daha seçilemez."],
["V","Yargı","CIKAR","İdari yargının en üst mahkemesi hangisidir?","Danıştay|Yargıtay|Sayıştay|Uyuşmazlık Mahkemesi|Anayasa Mahkemesi","Danıştay idari mahkemelerin; Yargıtay adli mahkemelerin son inceleme merciidir."],
["V","Yargı","COK","Uyuşmazlık Mahkemesi'nin görevi aşağıdakilerden hangisidir?","Adli ve idari yargı arasındaki görev ve hüküm uyuşmazlıklarını kesin olarak çözmek|Kanunların Anayasa'ya uygunluğunu denetlemek|Kamu harcamalarını TBMM adına denetlemek|Seçimlerin genel yönetimini yapmak|Hâkim ve savcıları atamak","Anayasa'ya uygunluk denetimi Anayasa Mahkemesi'nin, harcama denetimi Sayıştay'ın, seçimler YSK'nın, hâkim-savcı atamaları HSK'nın görevidir."],
["V","Yargı","CIKTI","Sayıştay, kamu harcamalarını kim adına denetler?","TBMM adına|Cumhurbaşkanı adına|Hazine ve Maliye Bakanlığı adına|Danıştay adına|Anayasa Mahkemesi adına","Sayıştay, merkezî yönetim bütçesi kapsamındaki kamu idarelerinin gelir, gider ve mallarını TBMM adına denetler."],
["V","Temel Haklar","COK","1982 Anayasası'na göre aşağıdakilerden hangisi siyasi haklardandır?","Seçme ve seçilme hakkı|Eğitim hakkı|Mülkiyet hakkı|Konut dokunulmazlığı|Sağlık hakkı","Siyasi haklar: seçme-seçilme, siyasi parti kurma, kamu hizmetine girme, dilekçe hakkı. Eğitim ve sağlık sosyal; mülkiyet ve konut dokunulmazlığı kişi hakkıdır."],
["V","İdare","COK","Aşağıdakilerden hangisi mahallî idare değildir?","Valilik|Belediye|İl özel idaresi|Köy|Büyükşehir belediyesi","Valilik, merkezî yönetimin taşra teşkilatıdır. Mahallî idareler: il özel idaresi, belediye (büyükşehir dâhil) ve köydür."],
["V","İdare","CIKTI","Belediyenin karar organı aşağıdakilerden hangisidir?","Belediye meclisi|Belediye başkanı|Belediye encümeni|Vali|İl genel meclisi","Belediye organları: belediye meclisi (karar), belediye encümeni ve belediye başkanı (yürütme). İl genel meclisi il özel idaresinin karar organıdır."],
["V","Yasama","CIKAR","2017 Anayasa değişikliğinden sonra kanun teklif etme yetkisi kime aittir?","Milletvekillerine|Cumhurbaşkanına|Bakanlara|Danıştaya|Anayasa Mahkemesine","Kanun teklif etme yetkisi yalnızca milletvekillerindedir. Cumhurbaşkanı ise bütçe kanunu teklifini TBMM'ye sunar."],
["V","Hukuk","COK","Hukuk kurallarını ahlak, din ve görgü kurallarından ayıran temel özellik aşağıdakilerden hangisidir?","Devlet gücüyle desteklenen yaptırımının olması|Toplumsal hayatı düzenlemesi|Yazılı olmaması|Kişiden kişiye değişmesi|Yalnızca vicdani yaptırımının olması","Bütün sosyal kurallar toplumsal hayatı düzenler; hukuk kuralını ayıran şey devlet gücüyle uygulanan maddi yaptırımdır (ceza, tazminat, cebri icra, iptal, hükümsüzlük)."],
/* ================= TÜRKÇE (2) ================= */
["T","Yazım","COK","Aşağıdaki cümlelerin hangisinde «de» bağlacının yazımı yanlıştır?","Sende mi bu fikirdesin?|Ben de sizinle geleceğim.|Kitabı evde unuttum.|O da bu işe çok şaşırdı.|Okulda çok mutluydu.","Bağlaç olan «de» her zaman ayrı yazılır: «Sen de mi bu fikirdesin?» Çıkarıldığında anlam bozulmuyorsa bağlaçtır. «Evde, okulda»daki -de ise bulunma hâli ekidir, bitişik yazılır."],
["T","Yazım","COK","Aşağıdaki cümlelerin hangisinde «ki»nin yazımı yanlıştır?","Duydumki yarın gelmiyorsun.|Öyle yorgundu ki hemen uyudu.|Bahçedeki çiçekler açtı.|Benimki daha yeni.|Sanki her şey bir rüyaydı.","Bağlaç olan «ki» ayrı yazılır: «Duydum ki». Sıfat yapan «-ki» (bahçedeki) ve zamir yapan «-ki» (benimki) bitişik yazılır. «Sanki, oysaki, mademki, belki» kalıplaşmıştır, bitişik yazılır."],
["T","Yazım","CIKTI","Aşağıdaki cümlelerin hangisinde soru ekinin yazımı yanlıştır?","Yarın gelecekmisin?|Bu kitabı sen mi aldın?|Okula gidiyor musun?|Hava güzel mi?|Toplantıya katılacak mısınız?","Soru eki «mı, mi, mu, mü» her zaman ayrı yazılır, kendinden sonraki ekler ona bitişir: «gelecek misin»."],
["T","Yazım","COK","Aşağıdaki cümlelerin hangisinde sayıların yazımıyla ilgili bir yanlışlık vardır?","Toplantı saat onyedide başlayacak.|Sınıfta otuz iki öğrenci var.|Yarışmada 3'üncü oldu.|Kitabın 15. sayfasını açın.|Sınav 25 Ekim 2026'da yapılacak.","Birden fazla sözcükten oluşan sayılar ayrı yazılır: «on yedi, otuz iki». Sıra sayıları rakamla «15.» ya da «3'üncü» biçiminde yazılır."],
["T","Yazım","CIKAR","Aşağıdaki cümlelerin hangisinde büyük harflerin kullanımıyla ilgili bir yanlışlık vardır?","Yazın akdeniz kıyılarında tatil yaptık.|Bu kitabı Ahmet Bey'e verdim.|Türk Dil Kurumu yeni sözlüğü yayımladı.|Ankara'ya trenle gittik.|Pazartesi günü sınavımız var.","Deniz, göl, dağ gibi coğrafi özel adlar büyük harfle başlar: «Akdeniz». Gün ve ay adları belirli bir tarih bildirmiyorsa küçük yazılır; E şıkkında cümle başı olduğu için büyük harfle başlamıştır."],
["T","Noktalama","COK","Aşağıdaki cümlelerin hangisinde soru işareti yanlış kullanılmıştır?","Bu işi kimin yaptığını bilmiyorum?|Yarın bize gelir misin?|Bu kitabı kim yazdı?|Ne zaman döneceksin?|Hangi yoldan gidelim?","İçinde soru sözcüğü bulunsa da soru anlamı taşımayan cümlelerin sonuna nokta konur: «Bu işi kimin yaptığını bilmiyorum.»"],
["T","Noktalama","CIKTI","Aşağıdaki cümlelerden hangisinin sonuna ünlem işareti (!) konmalıdır?","Eyvah, otobüsü kaçırdık|Yarın sinemaya gidebiliriz|Kitabı masaya bıraktım|Akşam yemeğe kim gelecek|Bu yol şehre çıkıyor","Ünlem işareti sevinç, korku, şaşkınlık, acıma gibi duyguları anlatan cümlelerin sonuna konur. D şıkkının sonuna soru işareti gelir."],
["T","Ses Bilgisi","COK","Aşağıdaki sözcüklerin hangisinde ünsüz benzeşmesi (sertleşme) vardır?","kitapta|kitabı|evde|burnu|oğlu","Sert ünsüzle (f, s, t, k, ç, ş, h, p) biten sözcüğe c, d, g ile başlayan ek gelince bu ünsüzler sertleşir: kitap + da → kitapta."],
["T","Ses Bilgisi","CIKTI","Aşağıdaki sözcüklerin hangisinde ünlü daralması vardır?","başlıyor|geliyor|ağzı|kitabı|gitti","«-a, -e» ile biten fiillere «-yor» eki gelince geniş ünlü daralır: başla + yor → başlıyor, bekle + yor → bekliyor."],
["T","Ses Bilgisi","CIKAR","Aşağıdaki sözcüklerin hangisinde kaynaştırma ünsüzü kullanılmıştır?","kapıya|evde|kitap|gözlük|okulu","Ünlüyle biten sözcüğe ünlüyle başlayan ek gelince araya y, ş, s, n kaynaştırma ünsüzleri girer: kapı + (y) a → kapıya."],
["T","Ses Bilgisi","COK","Aşağıdaki sözcüklerden hangisi büyük ünlü uyumuna uymaz?","kitap|okul|çiçek|masa|güzel","Büyük ünlü uyumunda sözcüğün ünlüleri ya hep kalın (a, ı, o, u) ya hep ince (e, i, ö, ü) olmalıdır. «Kitap»ta i (ince) ve a (kalın) bir aradadır."],
["T","Ses Bilgisi","CIKAR","Aşağıdaki sözcüklerin hangisinde ünsüz türemesi vardır?","hakkı|kitabı|burnu|kapıya|başlıyor","Arapçadan geçen bazı tek heceli sözcükler ünlüyle başlayan ek alınca son ünsüz ikizleşir: hak → hakkı, his → hissi, af → affı."],
["T","Sözcükte Anlam","COK","Aşağıdaki cümlelerin hangisinde «kök» sözcüğü terim anlamıyla kullanılmıştır?","«Gözlük» sözcüğünün kökü «göz»dür.|Ağacın kökleri toprağın derinlerine inmiş.|Bu sorunu kökünden çözmeliyiz.|Bu gelenekler köklerini geçmişten alır.|Ailesinin kökü çok eskiye dayanıyor.","Terim anlam, bir bilim ya da sanat dalına özgü anlamdır. A'da «kök» dil bilgisi terimidir. B gerçek anlam; C, D ve E mecaz anlamdır."],
["T","Sözcükte Anlam","CIKTI","Aşağıdaki cümlelerin hangisinde karşıt anlamlı sözcükler bir arada kullanılmıştır?","Az veren candan, çok veren maldan verir.|Yavaş yavaş eve doğru yürüdü.|Güzel ve temiz bir odası vardı.|Kitap okumayı herkes sever.|Sabah erkenden kalktı.","«Az» ve «çok» karşıt anlamlıdır. B'de ikileme, C'de iki sıfat vardır ama karşıt değildir."],
["T","Sözcükte Anlam","CIKAR","Aşağıdaki cümlelerin hangisinde ad aktarması (mecaz-ı mürsel) vardır?","Bütün okul onu alkışladı.|Okulun bahçesi çok genişti.|Kitabı çantasına koydu.|Yağmur akşama kadar sürdü.|Kapıyı yavaşça kapattı.","Ad aktarmasında bir söz, benzetme amacı olmadan başka bir kavramın yerine kullanılır: «okul» → okuldaki öğrenciler ve öğretmenler. Benzeri: «Bütün İstanbul maçı izledi.»"],
["T","Cümlede Anlam","COK","Aşağıdaki cümlelerden hangisi nesnel bir yargı içerir?","Türkiye'nin başkenti Ankara'dır.|Bu roman, yazarın en sürükleyici eseridir.|İstanbul dünyanın en güzel şehridir.|Bu film herkesi derinden etkileyecek.|Yazarın üslubu son derece akıcı.","Nesnel yargı doğruluğu kanıtlanabilen, kişiden kişiye değişmeyen yargıdır. «En sürükleyici, en güzel, akıcı» gibi değerlendirmeler kişiseldir (öznel)."],
["T","Cümlede Anlam","COK","Aşağıdaki cümlelerin hangisinde koşul-sonuç ilişkisi vardır?","Düzenli çalışırsan sınavı kazanırsın.|Hasta olduğu için okula gelmedi.|Kilo vermek için spor yapıyor.|Kardeşi ondan daha uzundu.|Yorgun olmasına rağmen çalışmayı sürdürdü.","«-sa/-se» eki koşul bildirir: çalışmak koşul, kazanmak sonuçtur. Diğerleri sırasıyla neden-sonuç, amaç-sonuç, karşılaştırma ve karşıtlıktır."],
["T","Cümlede Anlam","CIKAR","Aşağıdaki cümlelerin hangisinde eserin üslubuyla (biçimiyle) ilgili bir değerlendirme yapılmıştır?","Yazar, yalın ve akıcı bir dille sesleniyor okuruna.|Romanda bir ailenin üç kuşak boyunca yaşadıkları anlatılıyor.|Eserde köyden kente göç konusu işleniyor.|Kitabın olayları savaş yıllarında geçiyor.|Öykülerin kahramanları sıradan insanlar.","Üslup; dil, anlatım ve söyleyiş özellikleridir (yalın, akıcı, süslü, sade...). Konu, olay, zaman ve kahramanlar ise içerikle ilgilidir."],
["T","Paragraf","COK","Düzenli egzersiz yalnızca bedeni güçlendirmekle kalmaz, ruh sağlığını da olumlu etkiler. Araştırmalar, haftada birkaç gün yapılan yürüyüşlerin bile kaygı ve stres düzeyini azalttığını gösteriyor. Üstelik bunun için pahalı spor salonlarına gitmek gerekmiyor; evde ya da parkta yapılan basit hareketler yeterli olabiliyor.\n\nBu parçada asıl anlatılmak istenen aşağıdakilerden hangisidir?","Düzenli egzersiz hem beden hem ruh sağlığına yarar ve herkesin kolayca yapabileceği bir etkinliktir.|Spor salonları çok pahalıdır.|Yürüyüş, en faydalı spor türüdür.|Stres yalnızca egzersizle azaltılabilir.|Evde spor yapmak salondan daha verimlidir.","Ana düşünce parçanın tamamını kapsar: egzersizin bedene ve ruha yararı + kolay ulaşılabilirliği. B, C, D ve E ya parçanın küçük bir ayrıntısıdır ya da parçada söylenmemiştir."],
["T","Paragraf","COK","Eskiden bir mektubun alıcısına ulaşması haftalar sürerdi; insanlar bu yüzden her cümleyi özenle seçer, duygularını kâğıda dikkatle dökerdi. Bugün ise mesajlar saniyeler içinde gönderiliyor. Hız kazandık ama yazdıklarımızın derinliği azaldı; kısaltmalar ve hazır ifadeler özenli cümlelerin yerini aldı.\n\nBu parçadan aşağıdakilerin hangisi çıkarılabilir?","İletişim hızlandıkça yazılı anlatımdaki özen azalmıştır.|Mektup yazmak bugün tamamen terk edilmiştir.|Kısaltmalar dili zenginleştirir.|Eskiden insanlar daha az iletişim kurardı.|Mesajlaşma, mektuptan daha samimidir.","«Çıkarılabilir» sorularında parçada açıkça ya da dolaylı olarak söylenenden fazlası şıkta yer almamalıdır. «Tamamen terk edilmiştir», «daha samimidir» gibi yargılar parçada yoktur."],
["T","Paragraf","CIKTI","Zeytin ağacı, Akdeniz havzasının simgesi sayılır. Kuraklığa dayanıklıdır ve yüzlerce yıl yaşayabilir. Meyvesinden elde edilen yağ hem beslenmede hem de sabun yapımında kullanılır. Ayrıca zeytin dalı eski çağlardan beri barışın simgesidir.\n\nBu parçada zeytin ağacıyla ilgili aşağıdakilerden hangisine değinilmemiştir?","Hangi ayda hasat edildiğine|Uzun ömürlü olduğuna|Kuraklığa dayanıklılığına|Yağının kullanım alanlarına|Simgesel anlamına","Her şıkkı parçada ara: uzun ömür ve kuraklık (2. cümle), yağın kullanımı (3. cümle), barış simgesi (4. cümle). Hasat zamanından söz edilmemiştir."],
["T","Paragraf","COK","Bir dili iyi öğrenmenin yolu, o dilde bol bol okumaktan geçer. ---- Bu nedenle dil öğrenen herkes, düzeyine uygun kitaplarla okuma alışkanlığı kazanmalıdır.\n\nBu parçada boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?","Okuyan kişi, sözcükleri bağlamı içinde görerek kalıcı biçimde öğrenir.|Dil öğrenmek için yurt dışına gitmek şarttır.|Dil bilgisi kuralları ezberlenmeden dil öğrenilemez.|Kitapların fiyatları son yıllarda çok arttı.|Bazı diller öğrenilmesi en zor dillerdir.","Boşluk, kendinden önceki cümleyi (okumanın önemi) açıklamalı ve sonraki «bu nedenle»ye gerekçe olmalıdır. Yalnızca A şıkkı bu köprüyü kurar."],
["T","Paragraf","CIKAR","Köyün girişinde yaşlı bir çınar vardı. Gövdesi öyle kalındı ki üç kişi kol kola girse saramazdı. Yaprakları yazın serin bir gölge yayar, dallarında serçeler cıvıldaşırdı.\n\nBu parçada ağır basan anlatım biçimi aşağıdakilerden hangisidir?","Betimleme|Tartışma|Açıklama|Öyküleme|Karşılaştırma","Betimleme, bir varlığın ayırt edici özelliklerini okurun gözünde canlanacak biçimde anlatmaktır. Parçada bir olay örgüsü yok; çınarın görünüşü resmediliyor."],
["T","Paragraf","COK","«Dünyada her yıl yaklaşık on milyon hektar orman yok oluyor; bu, her yıl İzlanda büyüklüğünde bir alanın kaybedilmesi demek.»\n\nBu cümlede düşünceyi geliştirme yollarından hangileri kullanılmıştır?","Sayısal verilerden yararlanma ve karşılaştırma|Tanık gösterme ve örnekleme|Tanımlama ve tanık gösterme|Benzetme ve kişileştirme|Örnekleme ve tanımlama","«On milyon hektar» sayısal veridir; kaybedilen alanın İzlanda'nın yüz ölçümüyle ölçülmesi karşılaştırmadır."],
["T","Paragraf","CIKTI","Aşağıdakilerin hangisinde tanık gösterme yoluna başvurulmuştur?","Atatürk'ün de belirttiği gibi «Hayatta en hakiki mürşit ilimdir.»|Bilim, gözlem ve deneye dayanır.|Örneğin su, deniz seviyesinde 100 derecede kaynar.|Bilim, bir ışık gibi karanlığı aydınlatır.|Her yıl binlerce bilimsel makale yayımlanıyor.","Tanık gösterme, düşünceyi güçlendirmek için tanınmış bir kişinin sözüne başvurmaktır. B tanımlama, C örnekleme, D benzetme, E sayısal veriye dayanır."],
["T","Cümle Türleri","COK","Aşağıdaki cümlelerden hangisi yapısına göre birleşik cümledir?","Okula gelince öğretmenini aradı.|Kitabı masaya bıraktı.|Akşam erkenden uyudu.|Bahçedeki çiçekler açtı.|Yarın sinemaya gideceğiz.","Fiilimsi (gelince: zarf-fiil) içeren cümleler birleşik cümledir. «Bahçedeki»nde fiilimsi değil «-ki» eki vardır; cümle basittir."],
["T","Cümle Türleri","CIKTI","Aşağıdakilerden hangisi isim cümlesidir?","Bu ev çok güzel.|Kitabı dün okudu.|Yarın bize gelecek.|Ders çalışıyor.|Erkenden uyudu.","Yüklemi isim ya da isim soylu sözcük olan cümle isim cümlesidir (güzel). Diğerlerinin yüklemi çekimli fiildir."],
["T","Cümle Türleri","CIKAR","Aşağıdaki cümlelerden hangisi biçimce olumsuz, anlamca olumludur?","Bu durumu bilmeyen yok.|Yarın okula gitmeyeceğim.|Bu kitabı henüz okumadım.|Sınava girmedi.|Toplantıya katılmak istemiyor.","«Bilmeyen yok» = herkes biliyor. İki olumsuzluk (-me + yok) olumlu anlam verir. Diğerleri hem biçimce hem anlamca olumsuzdur."],
["T","Cümlenin Ögeleri","COK","«Bahçedeki yaşlı ağaç dün gece fırtınada devrildi.» cümlesinin öznesi aşağıdakilerden hangisidir?","Bahçedeki yaşlı ağaç|yaşlı ağaç|ağaç|dün gece|fırtınada","Özne, yükleme «kim/ne devrildi?» sorusu sorularak bulunur ve tamlamanın tamamıdır: «Bahçedeki yaşlı ağaç». «Dün gece» ve «fırtınada» zarf tümlecidir."],
["T","Cümlenin Ögeleri","CIKAR","«Annem, aldığı kitapları kütüphaneye yerleştirdi.» cümlesinde nesne aşağıdakilerden hangisidir?","aldığı kitapları|Annem|kütüphaneye|yerleştirdi|kitapları kütüphaneye","Nesne «neyi yerleştirdi?» sorusunun cevabıdır: «aldığı kitapları» (belirtili nesne). «Annem» özne, «kütüphaneye» dolaylı tümleç, «yerleştirdi» yüklemdir."],
["T","Sözcük Türleri","COK","Aşağıdaki cümlelerin hangisinde edat (ilgeç) kullanılmamıştır?","Kitabı okudu ve çok beğendi.|Senin için buraya kadar geldim.|Akşama kadar onu bekledi.|Mektubu kurşun kalem ile yazdı.|Sabaha doğru yağmur durdu.","«Ve» bağlaçtır. «İçin, kadar, ile (araç), doğru» ise tek başına anlamı olmayan, önündeki sözcükle anlam kazanan edatlardır."],
["T","Sözcük Türleri","CIKTI","Aşağıdaki cümlelerin hangisinde «ile» bağlaç olarak kullanılmıştır?","Ali ile Veli okula birlikte gitti.|İşe otobüs ile geldi.|Mektubu kalem ile yazdı.|Sevinç ile bahçeye koştu.|Akşam yemeğini çatal ile yedi.","«İle» yerine «ve» getirilebiliyorsa bağlaçtır: «Ali ve Veli». Diğerlerinde araç ya da durum bildiren edattır."],
["T","Sözcük Türleri","COK","Aşağıdaki cümlelerin hangisinde işaret zamiri kullanılmıştır?","Bunu bana kim verdi?|Bu kitabı ben aldım.|O ev çok eski.|Şu kalemi uzatır mısın?|Bu yol nereye gidiyor?","İşaret sözcüğü bir ismin yerini tutuyorsa zamirdir (Bunu = bu şeyi). Bir ismin önünde onu gösteriyorsa işaret sıfatıdır (bu kitap, o ev, şu kalem, bu yol)."],
["T","Fiiller","CIKAR","«Yarın erkenden yola çıkacağız.» cümlesindeki yüklem hangi kiple çekimlenmiştir?","Gelecek zaman|Şimdiki zaman|Geniş zaman|Gereklilik kipi|Dilek-şart kipi","«-acak/-ecek» gelecek zaman ekidir. Şimdiki zaman «-yor», geniş zaman «-r/-ar», gereklilik «-malı», dilek-şart «-sa»dır."],
["T","Fiiller","COK","Aşağıdaki cümlelerin hangisinde yüklem edilgen çatılıdır?","Mektuplar dün postaya verildi.|Kardeşim yemeğini yedi.|Annem çamaşırları yıkadı.|Öğrenciler sınıfa girdi.|Babam arabayı tamir etti.","Edilgen çatıda eylemi yapan belli değildir ve fiil «-l» ya da «-n» eki alır: ver-il-di. «Mektupları kim verdi?» sorusunun cevabı cümlede yoktur."],
["T","Yapı Bilgisi","CIKTI","Aşağıdaki sözcüklerden hangisi fiilden türemiş bir isimdir?","yazı|gözlük|kitapçı|evcil|tuzlu","yaz- (fiil) + -ı → yazı. Diğerleri isimden türemiştir: göz-lük, kitap-çı, ev-cil, tuz-lu."],
["T","Anlatım Bozukluğu","COK","Aşağıdaki cümlelerin hangisinde anlamca çelişen sözcüklerin bir arada kullanılmasından kaynaklanan bir anlatım bozukluğu vardır?","Kesinlikle bu akşam gelebilir.|Bu akşam gelmesi muhtemel.|Mutlaka bu akşam gelecek.|Belki bu akşam gelir.|Bu akşam geleceğini söyledi.","«Kesinlikle» kesinlik, «-ebilir» ise olasılık bildirir; ikisi bir arada kullanılamaz."],
["T","Anlatım Bozukluğu","CIKAR","Aşağıdaki cümlelerin hangisinde ortak kullanılan ögeyle yüklemlerden biri arasındaki uyumsuzluktan kaynaklanan bir anlatım bozukluğu vardır?","Konu toplantıda görüşüldü ve sonunda karara bağladı.|Kitabı okudu ve arkadaşına verdi.|Eve geldi, yemeğini yedi.|Sorun incelendi ve çözüldü.|Mektubu yazdı ama göndermedi.","«Görüşüldü» edilgen, «karara bağladı» etkendir; ortak özne «konu» ikinci yükleme uymaz. Doğrusu: «...görüşüldü ve karara bağlandı.»"],
["T","Deyim","COK","«Gözden düşmek» deyiminin anlamı aşağıdakilerden hangisidir?","Değerini, itibarını yitirmek|Uykusuz kalmak|Görme yeteneğini kaybetmek|Çok yorulmak|Bir yerden ayrılmak","Deyimler genellikle mecaz anlamlıdır. «Gözden düşmek» sevilen, değer verilen birinin bu değerini kaybetmesidir."],
["T","Deyim","CIKTI","«Damlaya damlaya göl olur.» atasözüyle anlatılmak istenen aşağıdakilerden hangisidir?","Küçük birikimler zamanla büyük bir varlık oluşturur.|Yağmur suları mutlaka biriktirilmelidir.|Su asla israf edilmemelidir.|Az konuşan çok dinler.|Her işin bir zamanı vardır.","Atasözü, azar azar yapılan birikimin zamanla büyük sonuç vereceğini anlatır; tutumlu olmayı öğütler."],
["T","Deyim","CIKAR","«Kulak asmamak» deyiminin anlamı aşağıdakilerden hangisidir?","Önemsememek, dikkate almamak|Çok dikkatli dinlemek|Gizlice dinlemek|Hiç duyamamak|Söyleneni hemen yapmak","«Söylenenlere kulak asmadı» = önemsemedi, aldırmadı. Karşıtı «kulak vermek»tir."],
/* ================= TARİH (2) ================= */
["H","İslamiyet Öncesi","COK","Asya Hun Devleti'nde ordunun onlu sisteme göre teşkilatlandırılması hangi hükümdar döneminde olmuştur?","Mete Han|Teoman|Bumin Kağan|Bilge Kağan|Attila","Mete Han (MÖ 209) orduyu onlu sisteme göre düzenledi; bu sistem Türk ordularının temeli oldu ve günümüz Türk Kara Kuvvetleri'nin kuruluş yılı olarak MÖ 209 kabul edilir."],
["H","İslamiyet Öncesi","CIKTI","375 Kavimler Göçü'nün sonuçlarından biri aşağıdakilerden hangisidir?","Avrupa'nın etnik yapısının değişmesi|İstanbul'un fethedilmesi|Haçlı Seferleri'nin başlaması|Türklerin İslamiyet'i kabul etmesi|Coğrafi Keşiflerin başlaması","Hunların batıya ilerlemesiyle başlayan göç Avrupa'nın etnik yapısını değiştirdi, Roma ikiye ayrıldı, feodalite ortaya çıktı."],
["H","İslamiyet Öncesi","CIKTI","Avrupa Hun Hükümdarı Attila'nın Doğu Roma (Bizans) ile imzaladığı antlaşmalar hangileridir?","Margus ve Anatolius Antlaşmaları|Karlofça ve Pasarofça Antlaşmaları|Zitvatorok ve Vasvar Antlaşmaları|Sevr ve Lozan Antlaşmaları|Mudanya ve Mondros Antlaşmaları","Margus (434) ve Anatolius (447) antlaşmalarıyla Doğu Roma vergiye bağlandı; Hunların Avrupa'daki gücü doruğa ulaştı."],
["H","İslamiyet Öncesi","COK","İslamiyet öncesi Türk devletlerinde önemli devlet işlerinin görüşüldüğü meclise ne ad verilir?","Kurultay (Toy)|Divan-ı Hümayun|Senato|Ayan Meclisi|Meşveret Meclisi","Kurultay danışma niteliğindeydi; son karar hükümdarındı. Divan-ı Hümayun Osmanlı'ya, Senato Roma'ya aittir."],
["H","İslamiyet Öncesi","CIKAR","İslamiyet öncesi Türklerde yazılı olmayan hukuk kurallarına ne denir?","Töre|Kut|Yasa|Kanunname|Şeriat","Töre; gelenek, kurultay kararları ve hükümdar buyruklarından oluşan yazısız hukuktur. Kut, yönetme yetkisinin Tanrı'dan geldiği inancıdır."],
["H","İslamiyet Öncesi","CIKAR","Eski Türklerde ölen kişi için yapılan cenaze törenine ne ad verilir?","Yuğ|Sığır|Şölen|Balbal|Kurultay","Yuğ cenaze törenidir. Balbal, mezara öldürülen düşman sayısınca dikilen taşlardır. Sığır sürek avı, şölen (toy) kağanın verdiği ziyafettir."],
["H","Türk-İslam","COK","«Sultan» unvanını kullanan ilk Türk hükümdarı kimdir?","Gazneli Mahmut|Tuğrul Bey|Alparslan|Satuk Buğra Han|Melikşah","Gazneli Mahmut, Hindistan'a 17 sefer düzenleyip İslamiyet'i yaydı ve «Sultan» unvanını kullanan ilk Türk hükümdarı oldu."],
["H","Türk-İslam","CIKTI","1040 Dandanakan Savaşı'nın sonucu aşağıdakilerden hangisidir?","Büyük Selçuklu Devleti kuruldu.|Anadolu'nun kapıları Türklere açıldı.|Gazneliler en güçlü dönemine ulaştı.|Abbasi Halifeliği yıkıldı.|Moğol istilası başladı.","Selçuklular Gaznelileri yenerek Büyük Selçuklu Devleti'ni resmen kurdular. Anadolu'nun kapıları Malazgirt'te (1071) açıldı."],
["H","Türk-İslam","COK","Selçuklular ile Bizans arasındaki ilk savaş hangisidir?","Pasinler Savaşı (1048)|Malazgirt Savaşı (1071)|Dandanakan Savaşı (1040)|Katvan Savaşı (1141)|Miryokefalon Savaşı (1176)","Pasinler Savaşı'nı Selçuklular kazandı; Bizans'ın Anadolu'yu savunamayacağı görüldü. Katvan'da Selçuklular Karahıtaylara yenildi."],
["H","Türk-İslam","CIKAR","Büyük Selçuklu Devleti'nde Nizamiye Medreselerini kuran kimdir?","Nizamülmülk|Orhan Bey|Fatih Sultan Mehmet|Kaşgarlı Mahmut|Yusuf Has Hacip","Vezir Nizamülmülk'ün kurduğu Nizamiye Medreseleri ilk düzenli devlet medreseleridir. Nizamülmülk «Siyasetname» adlı eseri de yazdı."],
["H","Türk-İslam","CIKTI","«Kutadgu Bilig» adlı eserin yazarı kimdir?","Yusuf Has Hacip|Kaşgarlı Mahmut|Edip Ahmet Yükneki|Ahmet Yesevi|Nizamülmülk","Kutadgu Bilig (mutluluk veren bilgi) Karahanlı döneminde yazılmış ilk Türkçe İslami eserdir; devlet yönetimini anlatır. Divan-ı Lügati't-Türk Kaşgarlı Mahmut'a, Atabetü'l-Hakayık Edip Ahmet'e, Divan-ı Hikmet Ahmet Yesevi'ye aittir."],
["H","Türk-İslam","COK","Kaşgarlı Mahmut'un «Divan-ı Lügati't-Türk»ü yazma amacı aşağıdakilerden hangisidir?","Araplara Türkçeyi öğretmek ve Türkçenin Arapça kadar zengin olduğunu göstermek|Devlet yönetimi hakkında hükümdara öğüt vermek|Selçuklu tarihini kaydetmek|Tasavvufu halka anlatmak|Osmanlı kanunlarını derlemek","Eser Türkçe-Arapça bir sözlüktür; Türk boyları, dilleri ve kültürü hakkında bilgi verir ve ilk Türk dünyası haritasını içerir."],
["H","Türkiye Selçuklu","CIKAR","Anadolu'da kurulan ilk Türk beyliği aşağıdakilerden hangisidir?","Saltuklular|Danişmentliler|Mengücekliler|Artuklular|Çaka Beyliği","Malazgirt'ten sonra (1072) Erzurum merkezli Saltuklu Beyliği kuruldu. Danişmentliler Sivas, Mengücekliler Erzincan, Artuklular Diyarbakır-Mardin çevresinde kuruldu."],
["H","Türkiye Selçuklu","CIKTI","İzmir merkezli kurulan ve ilk Türk donanmasını oluşturan beylik hangisidir?","Çaka Beyliği|Karamanoğulları|Saltuklular|Germiyanoğulları|Danişmentliler","Çaka Bey İzmir'de ilk Türk donanmasını kurdu ve Bizans'a karşı denizde mücadele etti."],
["H","Beylikler","COK","Türkçeyi resmî dil ilan eden beylik hangisidir?","Karamanoğulları|Germiyanoğulları|Osmanoğulları|Candaroğulları|Saruhanoğulları","Karamanoğlu Mehmet Bey 1277'de Türkçeyi resmî dil ilan etti. Karamanoğulları uzun süre Osmanlı'nın Anadolu'daki en büyük rakibi oldu."],
["H","Osmanlı Kuruluş","COK","1402 Ankara Savaşı'nın Osmanlı Devleti açısından sonucu aşağıdakilerden hangisidir?","Fetret Devri başladı.|Anadolu Türk birliği sağlandı.|İstanbul fethedildi.|Balkanlardaki Osmanlı hâkimiyeti sona erdi.|Kapitülasyonlar verildi.","Timur'a yenilen Yıldırım Bayezid esir düştü; şehzadeler arasında taht kavgaları (Fetret Devri, 1402-1413) başladı ve Anadolu Türk birliği bozuldu."],
["H","Osmanlı Kuruluş","CIKTI","Fetret Devri'ne son veren padişah kimdir?","Çelebi Mehmet|II. Murat|Musa Çelebi|Yıldırım Bayezid|Fatih Sultan Mehmet","Çelebi Mehmet 1413'te kardeşlerini yenerek devletin birliğini yeniden sağladı; bu nedenle «devletin ikinci kurucusu» sayılır."],
["H","Osmanlı Kuruluş","COK","Varna (1444) ve II. Kosova (1448) savaşlarının ortak sonucu aşağıdakilerden hangisidir?","Haçlılar, Türkleri Balkanlardan atma ümidini kaybetti.|İstanbul fethedildi.|Halifelik Osmanlılara geçti.|Fetret Devri sona erdi.|Osmanlı ilk kez toprak kaybetti.","II. Murat döneminde kazanılan bu savaşlarla Balkanlarda Türk hâkimiyeti kesinleşti ve Haçlılar savunmaya çekildi."],
["H","Osmanlı Yükselme","CIKAR","«Kanunname-i Âl-i Osman» adlı teşkilat kanunnamesini hazırlatan padişah kimdir?","Fatih Sultan Mehmet|Kanuni Sultan Süleyman|Yavuz Sultan Selim|Orhan Bey|II. Bayezid","Fatih, devlet teşkilatını ve kardeş katlini de düzenleyen bu kanunnameyi hazırlattı; merkeziyetçi yapıyı güçlendirdi."],
["H","Osmanlı Yükselme","COK","Yavuz Sultan Selim, 1514 Çaldıran Savaşı'nı hangi devlete karşı yapmıştır?","Safevi Devleti|Memlük Devleti|Dulkadiroğulları|Bizans İmparatorluğu|Venedik Cumhuriyeti","Çaldıran'da Safevi (İran) yenildi; Doğu Anadolu güvenceye alındı. Memlükler Mercidabık (1516) ve Ridaniye (1517) savaşlarıyla yıkıldı."],
["H","Osmanlı Yükselme","CIKTI","1526 Mohaç Meydan Muharebesi hangi devlete karşı yapılmıştır?","Macar Krallığı|Avusturya|Lehistan|Venedik|Rusya","Kanuni döneminde kısa sürede kazanılan Mohaç zaferiyle Macaristan Osmanlı'ya bağlandı."],
["H","Osmanlı Yükselme","COK","1538 Preveze Deniz Savaşı'nın sonucu aşağıdakilerden hangisidir?","Akdeniz'de Osmanlı deniz üstünlüğü sağlandı.|Kıbrıs Osmanlılara geçti.|İnebahtı'da Osmanlı donanması yakıldı.|Rodos fethedildi.|Kapitülasyonlar kaldırıldı.","Barbaros Hayrettin Paşa komutasındaki Osmanlı donanması Haçlı donanmasını yendi; Akdeniz bir «Türk gölü» hâline geldi."],
["H","Osmanlı Yükselme","CIKAR","Osmanlı Devleti en geniş sınırlarına hangi antlaşma ile ulaşmıştır?","Bucaş Antlaşması (1672)|Karlofça Antlaşması (1699)|Zitvatorok Antlaşması (1606)|Kasr-ı Şirin Antlaşması (1639)|Belgrad Antlaşması (1739)","Lehistan ile imzalanan Bucaş Antlaşması'yla Podolya alındı; Osmanlı batıda en geniş sınırlarına ulaştı."],
["H","Osmanlı Yükselme","CIKTI","Günümüz Türkiye-İran sınırına büyük ölçüde temel oluşturan antlaşma hangisidir?","Kasr-ı Şirin Antlaşması (1639)|Amasya Antlaşması (1555)|Ferhat Paşa Antlaşması (1590)|Nasuh Paşa Antlaşması (1612)|Karlofça Antlaşması (1699)","IV. Murat döneminde imzalanan Kasr-ı Şirin ile Bağdat Osmanlı'da kaldı; çizilen sınır bugünkü Türkiye-İran sınırının temelidir."],
["H","Osmanlı Gerileme","COK","Lale Devri hangi antlaşmayla başlamıştır?","Pasarofça Antlaşması (1718)|Karlofça Antlaşması (1699)|Belgrad Antlaşması (1739)|Küçük Kaynarca Antlaşması (1774)|Prut Antlaşması (1711)","Pasarofça ile başlayıp Patrona Halil İsyanı (1730) ile sona eren Lale Devri'nde ilk matbaa kuruldu ve Avrupa'ya geçici elçiler gönderildi."],
["H","Osmanlı Gerileme","CIKTI","Osmanlı'da ilk Türk matbaasını kuran kimdir?","İbrahim Müteferrika|Piri Reis|Evliya Çelebi|Kâtip Çelebi|Nedim","İbrahim Müteferrika ve Said Mehmet Çelebi, Lale Devri'nde (1727) ilk Türk matbaasını kurdu; ilk basılan kitap Vankulu Lügati'dir."],
["H","Osmanlı Dağılma","COK","«Nizam-ı Cedit» adlı yeni orduyu kuran padişah kimdir?","III. Selim|II. Mahmut|I. Abdülhamit|III. Ahmet|Abdülmecit","III. Selim döneminde kurulan Nizam-ı Cedit ordusu, Kabakçı Mustafa İsyanı (1807) ile dağıtıldı."],
["H","Osmanlı Dağılma","COK","Yeniçeri Ocağı'nı kaldıran (Vaka-i Hayriye, 1826) padişah kimdir?","II. Mahmut|III. Selim|Abdülmecit|Abdülaziz|II. Abdülhamit","II. Mahmut Yeniçeri Ocağı'nı kaldırıp yerine «Asakir-i Mansure-i Muhammediye» ordusunu kurdu."],
["H","Osmanlı Dağılma","CIKTI","Osmanlı tarihinde padişahın yetkilerinin ilk kez sınırlandırıldığı belge hangisidir?","Sened-i İttifak (1808)|Tanzimat Fermanı (1839)|Islahat Fermanı (1856)|Kanun-i Esasi (1876)|Kanunname-i Âl-i Osman","Sened-i İttifak, ayanların zorlamasıyla imzalandı. Tanzimat'ta ise padişah yetkilerini ilk kez kendi isteğiyle sınırladı."],
["H","Osmanlı Dağılma","COK","1856 Islahat Fermanı daha çok hangi kesimin haklarını genişletmiştir?","Gayrimüslimlerin|Ayanların|Yeniçerilerin|Kadınların|Köylülerin","Islahat Fermanı, Avrupa'nın baskısıyla gayrimüslimlere geniş haklar tanıdı; amaç Paris Barış Konferansı'nda Avrupa'nın desteğini almaktı."],
["H","I. Dünya Savaşı","CIKAR","I. Dünya Savaşı'nda Osmanlı Devleti'nin aşağıdaki cephelerinden hangisinde taarruz (saldırı) amaçlanmıştır?","Kafkas Cephesi|Çanakkale Cephesi|Irak Cephesi|Suriye-Filistin Cephesi|Hicaz-Yemen Cephesi","Osmanlı'nın taarruz cepheleri Kafkas ve Kanal cepheleridir. Kafkas'ta Sarıkamış'ta büyük kayıplar verildi. Çanakkale savunma cephesidir."],
["H","I. Dünya Savaşı","COK","Çanakkale Savaşları'nın sonuçlarından biri aşağıdakilerden hangisidir?","Rusya'ya yardım ulaştırılamadı ve Bolşevik İhtilali kolaylaştı.|Osmanlı Devleti savaştan çekildi.|Mondros Ateşkes Antlaşması imzalandı.|Arap İsyanı bastırıldı.|Kafkas Cephesi kapandı.","Boğazlar geçilemeyince Rusya'ya yardım ulaştırılamadı; Rusya'da Bolşevik İhtilali (1917) gerçekleşti, savaş uzadı ve Mustafa Kemal tanındı."],
["H","I. Dünya Savaşı","CIKTI","Mondros Ateşkes Antlaşması'nın hangi maddesi İtilaf Devletleri'ne güvenliklerini tehdit eden durumda herhangi bir stratejik noktayı işgal etme hakkı vermiştir?","7. madde|1. madde|5. madde|16. madde|24. madde","7. madde en ağır maddedir ve işgallere zemin hazırladı. 24. madde «Vilayet-i Sitte»de karışıklık çıkarsa işgal hakkı tanır."],
["H","Millî Mücadele","COK","Kuvâ-yı Milliye ile ilgili aşağıdakilerden hangisi yanlıştır?","Merkezden yönetilen düzenli bir ordudur.|Millî bilinçle, kendiliğinden ortaya çıkmıştır.|Düzenli ordu kurulana kadar düşmanı oyalamıştır.|Halkın desteğiyle beslenmiştir.|Düzenli ordunun kurulmasıyla son bulmuştur.","Kuvâ-yı Milliye düzensiz, bölgesel ve gönüllü birliklerdi. Merkezî bir otoriteye bağlı değildi; TBMM düzenli orduyu kurunca kaldırıldı."],
["H","Millî Mücadele","CIKTI","Sivas Kongresi'nin önemi aşağıdakilerden hangisidir?","Bütün millî cemiyetler «Anadolu ve Rumeli Müdafaa-i Hukuk Cemiyeti» adı altında birleştirildi.|Manda ve himaye ilk kez reddedildi.|TBMM açıldı.|Misak-ı Millî kabul edildi.|Saltanat kaldırıldı.","Sivas Kongresi (4-11 Eylül 1919) toplanış ve aldığı kararlar bakımından ulusaldır; manda kesin olarak reddedildi, Ali Fuat Paşa Batı Cephesi komutanı yapıldı."],
["H","Millî Mücadele","COK","Türkiye Büyük Millet Meclisi hangi tarihte açılmıştır?","23 Nisan 1920|29 Ekim 1923|19 Mayıs 1919|1 Kasım 1922|30 Ağustos 1922","TBMM 23 Nisan 1920'de Ankara'da açıldı. 19 Mayıs 1919 Mustafa Kemal'in Samsun'a çıkışı, 29 Ekim 1923 Cumhuriyet'in ilanı, 1 Kasım 1922 saltanatın kaldırılmasıdır."],
["H","Millî Mücadele","CIKAR","TBMM'ye karşı çıkan ayaklanmaları önlemek için çıkarılan kanun hangisidir?","Hıyanet-i Vataniye Kanunu|Teşkilat-ı Esasiye Kanunu|Takrir-i Sükûn Kanunu|Tevhid-i Tedrisat Kanunu|Soyadı Kanunu","Hıyanet-i Vataniye Kanunu (1920) ve İstiklal Mahkemeleri ayaklanmalara karşı çıkarıldı. Takrir-i Sükûn 1925'te Şeyh Sait İsyanı üzerine çıkarıldı."],

["H","İnkılaplar","COK","Cumhuriyet'in ilanıyla aşağıdaki sorunlardan hangisi çözülmüştür?","Devlet başkanlığı (rejim) sorunu|Halifelik sorunu|Musul sorunu|Boğazlar sorunu|Dış borçlar sorunu","Saltanatın kaldırılmasından sonra devlet başkanlığı boşluğu Cumhuriyet'in ilanıyla (29 Ekim 1923) çözüldü. Halifelik 3 Mart 1924'te kaldırıldı."],

["C","Yer Şekilleri","COK","Karadeniz'de dağların kıyıya paralel uzanmasının sonuçlarından biri aşağıdakilerden hangisidir?","Kıyıların az girintili çıkıntılı olması ve doğal limanların az olması|Kıyılarda Akdeniz ikliminin görülmesi|Bölgede tarımın hiç yapılamaması|Delta ovalarının hiç bulunmaması|Deniz etkisinin iç kesimlere kolayca ulaşması","Dağlar kıyıya paralel olduğu için kıyı düzdür, doğal liman azdır, iç kesimlere ulaşım zordur ve deniz etkisi iç kesimlere giremez. Bafra ve Çarşamba delta ovaları vardır."],

["C","Yer Şekilleri","COK","Ege Bölgesi'nde dağların kıyıya dik uzanmasının sonucu aşağıdakilerden hangisidir?","Deniz etkisinin iç kesimlere kadar sokulabilmesi|Kıyıların az girintili çıkıntılı olması|Kıyıda yağışın her mevsim fazla olması|Ulaşımın çok zor olması|Kıyı ovalarının bulunmaması","Dağlar kıyıya dik uzandığından denizel hava kütleleri çöküntü ovaları (Gediz, Büyük Menderes) boyunca içerilere girer; kıyılar çok girintili çıkıntılıdır."],

["C","Madenler","COK","Türkiye'de petrol çıkarılan başlıca yerler aşağıdakilerin hangisinde birlikte verilmiştir?","Batman, Adıyaman ve Şırnak (Gabar)|Zonguldak ve Bartın|Konya ve Karaman|Rize ve Artvin|Edirne ve Kırklareli","Petrol en çok Güneydoğu Anadolu'dan çıkarılır. Şırnak'taki Gabar Dağı sahası son yıllarda üretimi önemli ölçüde artırdı."],

["C","Ulaşım","CIKAR","Marmaray projesi neyi sağlar?","İstanbul Boğazı'nın altından Avrupa ve Asya yakalarını demir yoluyla birleştirir.|Çanakkale Boğazı'nı köprüyle geçer.|Ankara-İstanbul arasında otoyol sağlar.|İzmir Körfezi'ni tünelle geçer.|Karadeniz'i Marmara'ya kanal ile bağlar.","Marmaray (2013), Boğaz'ın altından geçen tüp tünel ile iki kıtayı raylı sistemle bağlar. Çanakkale Boğazı'nı 1915 Çanakkale Köprüsü geçer."],
["C","Turizm","COK","Göbeklitepe hangi ilimizdedir?","Şanlıurfa|Mardin|Adıyaman|Diyarbakır|Gaziantep","Göbeklitepe yaklaşık 12 bin yıllık olup bilinen en eski anıtsal tapınak alanıdır; UNESCO Dünya Mirası Listesi'ndedir. Nemrut Dağı Adıyaman'dadır."],
["C","İklim","CIKTI","Türkiye'de kuzeydoğudan esen, kışın soğuk ve kar getiren rüzgâr hangisidir?","Poyraz|Lodos|Keşişleme|Samyeli|Karayel","Poyraz kuzeydoğudan eser ve soğuktur. Lodos güneybatıdan eser, sıcaklığı artırır; samyeli güneydoğudan esen sıcak ve kuru rüzgârdır."],
/* ================= VATANDAŞLIK (2) ================= */
["V","Anayasa Tarihi","COK","Türkiye'de halkoylamasıyla kabul edilen ilk anayasa hangisidir?","1961 Anayasası|1876 Kanun-i Esasi|1921 Anayasası|1924 Anayasası|1982 Anayasası","1961 Anayasası halkoylamasıyla kabul edilen ilk anayasadır; 1982 Anayasası da halkoylamasıyla kabul edildi."],
["V","Anayasa Tarihi","CIKTI","Değiştirilmesi normal kanunlara göre daha zor ve özel bir usule bağlı olan anayasaya ne ad verilir?","Sert (katı) anayasa|Yumuşak anayasa|Yazısız anayasa|Çerçeve anayasa|Kazuistik anayasa","1982 Anayasası serttir: değişiklik teklifi en az 200 milletvekilinin imzasını, kabulü ise en az 360 oyu gerektirir."],
["V","Anayasa Tarihi","COK","1921 Anayasası'nın (Teşkilat-ı Esasiye) özelliği aşağıdakilerden hangisidir?","Güçler birliği ilkesini benimsemiş, kısa ve öz bir anayasadır.|Kuvvetler ayrılığı ilkesini benimsemiştir.|Halkoylamasıyla kabul edilmiştir.|Laiklik ilkesine yer vermiştir.|Anayasa Mahkemesi'ni kurmuştur.","1921 Anayasası 23 maddedir; yasama ve yürütme TBMM'de toplanmıştır (meclis hükümeti sistemi). Millî egemenlik ilkesine ilk kez yer veren anayasadır."],
["V","Anayasa Tarihi","CIKAR","Kadınlara seçme ve seçilme hakkı tanıyan düzenlemeler hangi anayasa döneminde yapılmıştır?","1924 Anayasası|1876 Kanun-i Esasi|1921 Anayasası|1961 Anayasası|1982 Anayasası","Kadınlara 1934'te milletvekili seçme ve seçilme hakkı tanındı; bu dönemde 1924 Anayasası yürürlükteydi."],
["V","Anayasa Tarihi","COK","1961 Anayasası ile kurulan kurum aşağıdakilerden hangisidir?","Anayasa Mahkemesi|Danıştay|Yargıtay|Sayıştay|TBMM","1961 Anayasası Anayasa Mahkemesi'ni kurdu ve çift meclis (Millet Meclisi + Cumhuriyet Senatosu) sistemine geçti."],
["V","Anayasa Tarihi","CIKTI","Cumhuriyet döneminde çift meclis sistemine yer veren anayasa hangisidir?","1961 Anayasası|1921 Anayasası|1924 Anayasası|1982 Anayasası|Cumhuriyet anayasalarının hiçbiri","1961 Anayasası'nda TBMM, Millet Meclisi ve Cumhuriyet Senatosu'ndan oluşuyordu. Osmanlı'da 1876 Kanun-i Esasi de çift meclisliydi."],
["V","Temel Haklar","COK","1982 Anayasası'na göre temel hak ve hürriyetler nasıl sınırlanabilir?","Özlerine dokunulmaksızın yalnızca kanunla|Yönetmelikle|Cumhurbaşkanlığı kararnamesiyle|Valilik genelgesiyle|Bakanlık kararıyla","13. madde: Temel hak ve hürriyetler, özlerine dokunulmaksızın yalnızca Anayasa'da belirtilen sebeplere bağlı olarak ve ancak kanunla sınırlanabilir."],
["V","Temel Haklar","CIKTI","Savaş, seferberlik ve olağanüstü hallerde bile dokunulamayan haklardan biri aşağıdakilerden hangisidir?","Suç ve cezaların geriye yürümemesi|Toplantı ve gösteri yürüyüşü hakkı|Seyahat özgürlüğü|Basın özgürlüğü|Konut dokunulmazlığı","Çekirdek haklar: yaşam hakkı (savaş hukukuna uygun ölümler hariç), maddi ve manevi varlığın bütünlüğü, din-vicdan özgürlüğü, suç ve cezaların geriye yürümezliği, masumiyet karinesi."],
["V","Temel Haklar","CIKAR","1982 Anayasası'nda vatan hizmeti için hangi ifade yer alır?","Her Türk'ün hakkı ve ödevidir.|Yalnızca bir ödevdir.|İsteğe bağlı bir haktır.|Yalnızca kamu görevlileri için zorunludur.|Kanunla kaldırılabilir bir yükümlülüktür.","72. madde: «Vatan hizmeti her Türk'ün hakkı ve ödevidir.» Bu hizmetin nasıl yerine getirileceği kanunla düzenlenir."],
["V","Temel Haklar","COK","1982 Anayasası'na göre vergi, resim, harç ve benzeri mali yükümlülükler ne ile konulur?","Kanunla|Cumhurbaşkanlığı kararnamesiyle|Yönetmelikle|Genelgeyle|Belediye meclisi kararıyla","73. madde: Vergiler kanunla konulur, değiştirilir veya kaldırılır. Herkes mali gücüne göre vergi ödemekle yükümlüdür."],
["V","Seçim","CIKTI","Seçimlerin başından sonuna kadar genel yönetim ve denetimini yapan kurum hangisidir?","Yüksek Seçim Kurulu|TBMM|Anayasa Mahkemesi|İçişleri Bakanlığı|Danıştay","YSK seçimlerin düzen içinde yapılmasını sağlar; kararları kesindir, aleyhine başka bir mercie başvurulamaz."],
["V","Seçim","COK","Aşağıdakilerden hangisi Anayasa'da yer alan seçim ilkelerinden değildir?","Açık oy|Gizli oy|Eşit oy|Genel oy|Tek dereceli seçim","Seçimler serbest, eşit, gizli, tek dereceli, genel oy esaslarına göre yapılır; oyların sayım ve dökümü açık yapılır."],
["V","Seçim","CIKAR","Türkiye'de seçmen olabilmek için gereken yaş kaçtır?","18|16|19|21|25","18 yaşını dolduran her Türk vatandaşı seçme hakkına sahiptir. 2017'den beri milletvekili seçilme yaşı da 18'dir."],
["V","Yasama","COK","Aşağıdakilerden hangisi TBMM'nin görev ve yetkilerinden değildir?","Cumhurbaşkanlığı kararnamesi çıkarmak|Kanun koymak, değiştirmek ve kaldırmak|Bütçe kanununu kabul etmek|Savaş ilanına karar vermek|Genel ve özel af ilanına karar vermek","Cumhurbaşkanlığı kararnamesi çıkarmak Cumhurbaşkanı'nın yetkisidir. TBMM; kanun yapar, bütçeyi kabul eder, para basılmasına, savaş ilanına ve affa karar verir."],
["V","Yasama","CIKTI","2017 Anayasa değişikliğiyle kaldırılan TBMM denetim yolu hangisidir?","Gensoru|Meclis araştırması|Genel görüşme|Yazılı soru|Meclis soruşturması","Gensoru, hükümeti düşürmeye yönelik bir denetim yoluydu; parlamenter sistemle birlikte kaldırıldı. Diğer yollar sürmektedir."],
["V","Yasama","CIKAR","Milletvekillerinin Meclis çalışmalarındaki oy ve sözlerinden dolayı sorumlu tutulamamasına ne denir?","Yasama sorumsuzluğu|Yasama dokunulmazlığı|Meclis soruşturması|Gensoru|Seçim yasakları","Yasama sorumsuzluğu mutlaktır ve süreklidir. Yasama dokunulmazlığı ise milletvekilinin seçimden önce ya da sonra suç işlediği iddiasıyla Meclis kararı olmadan tutulamaması ve yargılanamamasıdır."],
["V","Yürütme","COK","Cumhurbaşkanı yardımcılarını ve bakanları kim atar?","Cumhurbaşkanı|TBMM|Anayasa Mahkemesi|Yüksek Seçim Kurulu|TBMM Başkanı","Cumhurbaşkanı, yardımcılarını ve bakanları milletvekili olmayanlar arasından atar ve görevden alır; milletvekili atanırsa vekilliği düşer."],
["V","Yürütme","CIKTI","Aşağıdakilerden hangisi Cumhurbaşkanlığı kararnamesiyle düzenlenemez?","Siyasi haklar|Bakanlıkların kurulması ve görevleri|Üst kademe kamu yöneticilerinin atanmasına ilişkin usuller|Yürütme yetkisine ilişkin konular|Kamu tüzel kişiliğinin kurulması","Temel haklar, kişi hakları ve siyasi haklar CBK ile düzenlenemez; kanunda açıkça düzenlenen konularda da CBK çıkarılamaz."],
["V","Yargı","CIKAR","Kanunların Anayasa'ya aykırılığı iddiasıyla Anayasa Mahkemesi'nde iptal davası açma süresi, yayımdan itibaren kaç gündür?","60|30|90|15|120","İptal davası (soyut norm denetimi) Resmî Gazete'de yayımdan itibaren 60 gün içinde açılır. Cumhurbaşkanı, TBMM'deki iki büyük grup ve üye tam sayısının beşte biri dava açabilir."],
["V","Yargı","COK","Bireysel başvuru hangi kuruma yapılır?","Anayasa Mahkemesi|Yargıtay|Danıştay|Kamu Denetçiliği Kurumu|Yüksek Seçim Kurulu","2010'dan beri herkes, Anayasa ve AİHS kapsamındaki temel haklarının kamu gücü tarafından ihlal edildiği iddiasıyla Anayasa Mahkemesi'ne bireysel başvuruda bulunabilir."],
["V","Yargı","CIKAR","Kamu Denetçiliği Kurumu (Ombudsman) nereye bağlıdır?","TBMM Başkanlığı|Cumhurbaşkanlığı|Adalet Bakanlığı|Danıştay|Anayasa Mahkemesi","Kamu Denetçiliği Kurumu, idarenin işleyişiyle ilgili şikâyetleri inceler ve TBMM Başkanlığına bağlıdır."],
["V","Yargı","COK","Hâkimler ve Savcılar Kurulu'nun (HSK) başkanı kimdir?","Adalet Bakanı|Cumhurbaşkanı|Yargıtay Başkanı|TBMM Başkanı|Danıştay Başkanı","HSK 13 üyelidir; başkanı Adalet Bakanı, tabii üyesi Adalet Bakan Yardımcısıdır. 4 üyeyi Cumhurbaşkanı, 7 üyeyi TBMM seçer."],
["V","Yargı","CIKTI","2017 Anayasa değişikliğiyle kaldırılan yüksek mahkemeler hangileridir?","Askerî Yargıtay ve Askerî Yüksek İdare Mahkemesi|Danıştay ve Yargıtay|Sayıştay ve Danıştay|Uyuşmazlık Mahkemesi ve Yargıtay|Anayasa Mahkemesi ve Danıştay","2017'de savaş hâli dışında askerî mahkemeler kuruluşu kaldırıldı; Askerî Yargıtay ve AYİM de kaldırıldı."],
["V","Hukuk","COK","Türk Medeni Kanunu'na göre kişilik ne zaman başlar?","Çocuğun sağ ve tam doğmasıyla|18 yaşın doldurulmasıyla|Nüfusa kaydedilmekle|Ayırt etme gücüne sahip olmakla|Okula başlamakla","Kişilik, çocuğun sağ ve tam doğduğu anda başlar. Çocuk, sağ doğmak koşuluyla ana rahmine düştüğü andan itibaren hak ehliyetine sahiptir."],
["V","Hukuk","CIKTI","Aşağıdakilerden hangisi kişiliği sona erdirir?","Gaipliğe karar verilmesi|Kısıtlanma|Evlenme|Ergin olma|Yabancı bir ülkeye yerleşme","Kişilik ölümle, gaipliğe karar verilmesiyle ve ölüm karinesiyle sona erer. Kısıtlanma yalnızca fiil ehliyetini etkiler."],
["V","Hukuk","COK","Bir kişi ile eşinin kardeşi arasındaki hısımlık türü hangisidir?","Kayın hısımlığı|Üstsoy kan hısımlığı|Altsoy kan hısımlığı|Yansoy kan hısımlığı|Hısımlık yoktur","Evlilik yoluyla eşin kan hısımlarıyla kurulan hısımlık kayın hısımlığıdır. Kan hısımlığı aynı soydan gelenler arasındadır (anne-baba, çocuk, kardeş)."],
["V","Hukuk","CIKAR","Türk Medeni Kanunu'na göre yerleşim yeri için aşağıdakilerden hangisi doğrudur?","Kimse aynı anda birden fazla yerleşim yerine sahip olamaz.|Herkes istediği kadar yerleşim yeri edinebilir.|Yerleşim yeri yalnızca doğum yeridir.|Küçüklerin yerleşim yeri kendi seçtikleri yerdir.|Yerleşim yeri hiçbir şekilde değiştirilemez.","Yerleşim yeri, kişinin sürekli kalma niyetiyle oturduğu yerdir. Kimse aynı anda birden çok yerleşim yerine sahip olamaz; ancak iş yerleri birden fazla olabilir."],
["V","Hukuk","COK","Aşağıdakilerden hangisi kamu hukuku dalıdır?","Ceza hukuku|Borçlar hukuku|Ticaret hukuku|Medeni hukuk|Miras hukuku","Kamu hukuku devlet ile kişiler veya devlet organları arasındaki ilişkileri düzenler: anayasa, idare, ceza, vergi hukuku. Borçlar, ticaret ve medeni hukuk özel hukuktur."],
["V","Hukuk","CIKTI","Aşağıdakilerden hangisi özel hukuk dalıdır?","Ticaret hukuku|Anayasa hukuku|İdare hukuku|Vergi hukuku|Ceza hukuku","Özel hukuk kişiler arasındaki eşitliğe dayalı ilişkileri düzenler: medeni hukuk, borçlar hukuku, ticaret hukuku."],
["V","Hukuk","COK","Kanunun emredici hükümlerine aykırı bir sözleşmenin baştan itibaren geçersiz sayılması hangi yaptırım türüdür?","Hükümsüzlük (butlan)|Tazminat|Cebri icra|Ceza|Disiplin cezası","Kesin hükümsüzlük (butlan) işlemi baştan itibaren geçersiz kılar. Tazminat zararın giderilmesi, cebri icra borcun devlet gücüyle zorla yerine getirilmesidir."],
["V","Hukuk","CIKAR","Borcunu ödemeyen kişinin borcunun devlet gücüyle zorla yerine getirilmesine ne ad verilir?","Cebri icra|Tazminat|Hükümsüzlük|İptal|Ceza","Cebri icra icra daireleri aracılığıyla yapılır; örneğin borçlunun malları haczedilip satılarak alacaklıya ödeme yapılır."],
["V","İdare","COK","Aşağıdakilerden hangisi merkezî idarenin başkent teşkilatında yer almaz?","Valilik|Cumhurbaşkanlığı|Bakanlıklar|Millî Güvenlik Kurulu|Devlet Denetleme Kurulu","Valilik ve kaymakamlık merkezî idarenin taşra teşkilatıdır. Başkent teşkilatı Cumhurbaşkanlığı, bakanlıklar ve yardımcı kuruluşlardan oluşur."],
["V","İdare","CIKTI","İlde devletin ve Cumhurbaşkanı'nın temsilcisi olan yönetici kimdir?","Vali|Kaymakam|Belediye başkanı|İl genel meclisi başkanı|Muhtar","Vali, ilde devletin ve Cumhurbaşkanı'nın temsilcisi ve ayrı ayrı her bakanın temsilcisidir; Cumhurbaşkanı kararıyla atanır."],
["V","İdare","CIKAR","Aşağıdakilerden hangisi hizmet yönünden yerinden yönetim kuruluşudur?","Üniversiteler|Belediye|Köy|İl özel idaresi|Valilik","Hizmet yerinden yönetim kuruluşları belirli bir kamu hizmetini özerk olarak yürütür: üniversiteler, TRT, SGK. Belediye, köy ve il özel idaresi yer yönünden yerinden yönetimdir."],
["V","İdare","CIKAR","Mahallî idarelerin seçimleri kaç yılda bir yapılır?","5|4|3|6|7","Mahallî idare organlarının seçimleri 5 yılda bir yapılır (Anayasa 127. madde)."],
["V","İdare","COK","Köy idaresinin organları aşağıdakilerin hangisinde doğru verilmiştir?","Köy derneği, ihtiyar heyeti ve muhtar|Köy meclisi, encümen ve muhtar|Belediye meclisi, encümen ve başkan|İl genel meclisi, il encümeni ve vali|Köy derneği, belediye meclisi ve muhtar","Köy derneği köyde yaşayan seçmenlerden oluşan karar organıdır; ihtiyar heyeti ve muhtar seçimle iş başına gelir."],
["V","İnsan Hakları","CIKAR","Kralın yetkilerini sınırlayan ve insan hakları tarihinin ilk belgelerinden sayılan Magna Carta hangi ülkede ve hangi yıl imzalanmıştır?","İngiltere, 1215|Fransa, 1789|ABD, 1776|İngiltere, 1689|Fransa, 1215","Magna Carta (1215) İngiltere'de kralın yetkilerini soylular lehine sınırladı. 1689 İngiliz Haklar Bildirgesi, 1776 Virginia Haklar Bildirgesi, 1789 Fransız İnsan ve Yurttaş Hakları Bildirisi'dir."],
["V","İnsan Hakları","COK","İnsan Hakları Evrensel Beyannamesi hangi kuruluş tarafından ve hangi yıl kabul edilmiştir?","Birleşmiş Milletler, 1948|Avrupa Konseyi, 1950|Milletler Cemiyeti, 1920|Avrupa Birliği, 1993|NATO, 1949","BM Genel Kurulu beyannameyi 10 Aralık 1948'de kabul etti. Avrupa İnsan Hakları Sözleşmesi ise 1950'de Avrupa Konseyi bünyesinde imzalandı."],
["V","İnsan Hakları","CIKTI","Avrupa İnsan Hakları Mahkemesi hangi uluslararası kuruluşun bünyesindedir?","Avrupa Konseyi|Avrupa Birliği|NATO|Birleşmiş Milletler|AGİT","AİHM, Avrupa Konseyi'ne bağlıdır ve Strazburg'dadır. Türkiye 1949'dan beri Avrupa Konseyi üyesidir; AB üyesi değildir."],
/* ================= GÜNCEL: TÜİK 2025-2026 verileri ================= */
["G","TÜİK · Nüfus","COK","TÜİK'in Adrese Dayalı Nüfus Kayıt Sistemi (ADNKS) 2025 sonuçlarına göre Türkiye'nin nüfusu yaklaşık kaç kişidir?","86 milyon 92 bin|85 milyon 665 bin|84 milyon 680 bin|87 milyon 473 bin|83 milyon 155 bin","31 Aralık 2025 itibarıyla nüfus 86.092.168 kişi oldu (2024: 85.664.944). Nüfus bir yılda 427 bin kişi arttı. Kaynak: TÜİK, ADNKS Sonuçları 2025 (Şubat 2026)."],
["G","TÜİK · Nüfus","COK","ADNKS 2025 sonuçlarına göre nüfusu en az olan il hangisidir?","Bayburt|Tunceli|Ardahan|Kilis|Gümüşhane","Bayburt 82.836 kişiyle en az nüfuslu ildir; onu Tunceli, Ardahan, Gümüşhane ve Kilis izler. En kalabalık il 15.754.053 kişiyle İstanbul'dur. Kaynak: TÜİK, ADNKS 2025."],
["G","TÜİK · Nüfus","CIKAR","ADNKS 2025 sonuçlarına göre Türkiye'de kilometrekareye düşen kişi sayısı (nüfus yoğunluğu) kaçtır?","112|98|105|120|131","Türkiye'de nüfus yoğunluğu 112 kişi/km² oldu. En yoğun il kilometrekareye 2.943 kişiyle İstanbul'dur. Kaynak: TÜİK, ADNKS 2025."],
["G","TÜİK · Nüfus","CIKAR","ADNKS 2025 sonuçlarına göre nüfus yoğunluğu en yüksek il hangisidir?","İstanbul|Kocaeli|İzmir|Ankara|Bursa","İstanbul'da kilometrekareye 2.943 kişi düşmektedir. Türkiye nüfusunun %18,3'ü İstanbul'da yaşamaktadır. Kaynak: TÜİK, ADNKS 2025."],
["G","TÜİK · Nüfus","CIKAR","ADNKS 2025 sonuçlarına göre Türkiye'de ortanca yaş kaçtır?","34,9|34,4|33,5|36,2|32,8","Ortanca yaş 2024'te 34,4 iken 2025'te 34,9'a yükseldi; nüfus yaşlanmaya devam ediyor. Kaynak: TÜİK, ADNKS 2025."],
["G","TÜİK · Nüfus","CIKAR","ADNKS 2025 sonuçlarına göre Türkiye'nin yıllık nüfus artış hızı kaçtır?","Binde 5,0|Binde 3,4|Binde 7,1|Binde 13,1|Binde 1,2","Yıllık nüfus artış hızı 2024'te binde 3,4 iken 2025'te binde 5,0 oldu. Kaynak: TÜİK, ADNKS 2025."],
["G","TÜİK · Nüfus","CIKAR","ADNKS 2025 sonuçlarına göre Türkiye nüfusunun yaklaşık yüzde kaçı İstanbul'da yaşamaktadır?","%18,3|%12,5|%22,6|%15,1|%25,0","İstanbul'un nüfusu 15.754.053 kişidir ve Türkiye nüfusunun %18,3'ünü oluşturur. Kaynak: TÜİK, ADNKS 2025."],
["G","TÜİK · Nüfus","CIKAR","ADNKS 2025 sonuçlarına göre il ve ilçe merkezlerinde yaşayan nüfusun oranı yaklaşık yüzde kaçtır?","%93,6|%75,2|%84,9|%68,4|%99,1","İl ve ilçe merkezlerinde yaşayanların oranı 2024'te %93,4 iken 2025'te %93,6 oldu; belde ve köylerde yaşayanların oranı %6,4'tür. Kaynak: TÜİK, ADNKS 2025."],
["G","TÜİK · Nüfus","CIKAR","ADNKS 2025 sonuçlarına göre Türkiye'de ikamet eden yabancı nüfus yaklaşık kaç kişidir?","1,52 milyon|3,5 milyon|750 bin|5 milyon|250 bin","Türkiye'de ikamet eden yabancı nüfus 38.968 kişi artarak 1.519.515 kişi oldu. Kaynak: TÜİK, ADNKS 2025."],
["G","TÜİK · Nüfus","CIKAR","ADNKS 2025 sonuçlarına göre Türkiye'de kadın ve erkek nüfusu için aşağıdakilerden hangisi doğrudur?","Erkek nüfus kadın nüfustan biraz fazladır (%50,02 – %49,98).|Kadın nüfus erkek nüfustan belirgin biçimde fazladır.|Kadın ve erkek nüfusu tam olarak eşittir.|Kadınlar nüfusun %52'sini oluşturur.|Erkekler nüfusun %55'ini oluşturur.","Erkek nüfus 43.059.434, kadın nüfus 43.032.734 kişidir. Ancak 65 yaş ve üzerinde kadınlar daha fazladır (yaşlıların %55,3'ü kadın). Kaynak: TÜİK, ADNKS 2025."],
["G","TÜİK · Doğum","COK","TÜİK Doğum İstatistikleri 2025'e göre Türkiye'de toplam doğurganlık hızı (kadın başına ortalama çocuk sayısı) kaçtır?","1,42|1,49|2,10|1,62|1,30","Toplam doğurganlık hızı 2024'te 1,49 iken 2025'te 1,42'ye düştü. 2001'de 2,38'di; 2014'ten beri aralıksız azalıyor. Kaynak: TÜİK, Doğum İstatistikleri 2025 (Mayıs 2026)."],
["G","TÜİK · Doğum","COK","Bir ülkede nüfusun kendini yenileyebilmesi için gereken toplam doğurganlık hızı (yenilenme düzeyi) kaçtır?","2,10|1,42|1,50|3,00|2,50","Yenilenme düzeyi 2,10'dur. Türkiye 9 yıldır bu düzeyin altındadır (2025: 1,42). Bu nedenle 2026–2035 dönemi «Aile ve Nüfus On Yılı» ilan edildi."],
["G","TÜİK · Doğum","CIKAR","TÜİK Doğum İstatistikleri 2025'e göre toplam doğurganlık hızının en yüksek olduğu il hangisidir?","Şanlıurfa|Bartın|İstanbul|Edirne|Ankara","En yüksek doğurganlık 3,15 çocukla Şanlıurfa'da, en düşük 1,09 çocukla Bartın'dadır. Doğurganlığı 1,50'nin altında olan il sayısı 2025'te 59'a yükseldi. Kaynak: TÜİK, Doğum İstatistikleri 2025."],
["G","TÜİK · Doğum","CIKAR","TÜİK Doğum İstatistikleri 2025'e göre toplam doğurganlık hızının en düşük olduğu il hangisidir?","Bartın|Şanlıurfa|Şırnak|Van|Siirt","Bartın 1,09 çocukla en düşük doğurganlığa sahip ildir. Şanlıurfa (3,15) en yüksektir. Kaynak: TÜİK, Doğum İstatistikleri 2025."],
["G","TÜİK · Doğum","CIKAR","TÜİK verilerine göre 2025 yılında Türkiye'de canlı doğan bebek sayısı yaklaşık kaçtır?","895 bin|1 milyon 250 bin|650 bin|1 milyon 500 bin|500 bin","2025'te 895.374 canlı doğum gerçekleşti. Doğurganlık en yüksek ilkokul mezunu annelerde (2,51), en düşük yükseköğretim mezunu annelerde (1,24) görüldü. Kaynak: TÜİK, Doğum İstatistikleri 2025."],
["G","TÜİK · Evlenme","CIKAR","TÜİK Evlenme ve Boşanma İstatistikleri 2025'e göre ortalama ilk evlenme yaşı hangisinde doğru verilmiştir?","Erkek 28,5 – Kadın 26,0|Erkek 26,0 – Kadın 22,7|Erkek 30,1 – Kadın 28,0|Erkek 27,0 – Kadın 24,5|Erkek 25,5 – Kadın 23,0","2025'te ortalama ilk evlenme yaşı erkeklerde 28,5, kadınlarda 26,0 oldu (fark 2,5 yıl). 2001'de erkeklerde 26,0, kadınlarda 22,7 idi. Kaynak: TÜİK, Evlenme ve Boşanma İstatistikleri 2025 (Şubat 2026)."],
["G","TÜİK · Evlenme","CIKAR","TÜİK verilerine göre 2025 yılında Türkiye'de evlenme ve boşanma sayılarındaki değişim nasıl olmuştur?","Evlenmeler azalmış, boşanmalar artmıştır.|Evlenmeler artmış, boşanmalar azalmıştır.|Her ikisi de artmıştır.|Her ikisi de azalmıştır.|İkisinde de değişim olmamıştır.","Evlenen çift sayısı 569.983'ten 552.237'ye düştü; kaba evlenme hızı binde 6,43 oldu. Boşanan çift sayısı 193.793'e çıktı; kaba boşanma hızı binde 2,26 oldu. Kaynak: TÜİK, Evlenme ve Boşanma İstatistikleri 2025."],
["G","TÜİK · Evlenme","CIKAR","TÜİK verilerine göre 2025 yılında kaba evlenme hızının en yüksek olduğu il hangisidir?","Gaziantep|Tunceli|İzmir|Ankara|Sinop","Kaba evlenme hızı en yüksek binde 7,76 ile Gaziantep, en düşük binde 4,18 ile Tunceli'dir. Kaba boşanma hızı en yüksek il ise İzmir'dir. Kaynak: TÜİK, Evlenme ve Boşanma İstatistikleri 2025."],
["G","TÜİK · Evlenme","CIKAR","TÜİK verilerine göre 2025 yılında kaba boşanma hızının en yüksek olduğu il hangisidir?","İzmir|Gaziantep|Hakkâri|Bayburt|Şırnak","Kaba boşanma hızı en yüksek il binde 3,28 ile İzmir oldu. Boşanmaların %34,0'ı evliliğin ilk 5 yılında gerçekleşti. Kaynak: TÜİK, Evlenme ve Boşanma İstatistikleri 2025."],
["G","TÜİK · Evlenme","CIKAR","TÜİK verilerine göre 2025 yılında boşanmaların en çok gerçekleştiği evlilik süresi hangisidir?","İlk 5 yıl|6–10 yıl|11–15 yıl|16–20 yıl|21 yıl ve üzeri","Boşanmaların %34,0'ı evliliğin ilk 5 yılında, %20,3'ü 6–10. yıllar arasında gerçekleşti. Kaynak: TÜİK, Evlenme ve Boşanma İstatistikleri 2025."],
["G","TÜİK · Yaşlılar","COK","TÜİK «İstatistiklerle Yaşlılar 2025» bültenine göre 65 yaş ve üzeri nüfusun toplam nüfus içindeki oranı yüzde kaçtır?","%11,1|%9,5|%8,0|%14,5|%20,4","Yaşlı nüfus oranı 2020'de %9,5 iken 2025'te %11,1'e çıktı. Yaşlı nüfus 5 yılda %20,5 artarak 9.583.059 kişi oldu. Kaynak: TÜİK, İstatistiklerle Yaşlılar 2025 (Mart 2026)."],
["G","TÜİK · Yaşlılar","CIKAR","TÜİK verilerine göre 2025 yılında yaşlı nüfus oranının en yüksek olduğu il hangisidir?","Sinop|Şırnak|Şanlıurfa|İstanbul|Van","Yaşlı nüfus oranı en yüksek il %21,7 ile Sinop'tur; onu Kastamonu (%21,1) ve Giresun (%20,0) izler. En düşük il %3,8 ile Şırnak'tır. Kaynak: TÜİK, İstatistiklerle Yaşlılar 2025."],
["G","TÜİK · Yaşlılar","CIKAR","TÜİK verilerine göre 2025 yılında yaşlı nüfus oranının en düşük olduğu il hangisidir?","Şırnak|Sinop|Kastamonu|Giresun|Çanakkale","Şırnak %3,8 ile yaşlı nüfus oranının en düşük olduğu ildir. Şırnak aynı zamanda genç nüfus oranının en yüksek olduğu ildir. Kaynak: TÜİK, İstatistiklerle Yaşlılar 2025."],
["G","TÜİK · Yaşlılar","CIKAR","TÜİK verilerine göre 2025 yılında yaşlı nüfusun cinsiyete göre dağılımı için hangisi doğrudur?","Kadınlar yaşlı nüfusun %55,3'ünü oluşturur.|Erkekler yaşlı nüfusun %55,3'ünü oluşturur.|Kadın ve erkek yaşlı sayısı eşittir.|Kadınlar yaşlı nüfusun %40'ını oluşturur.|Erkekler yaşlı nüfusun %60'ını oluşturur.","Yaşlı nüfusun %55,3'ü kadın, %44,7'si erkektir; kadınların yaşam süresi daha uzundur. Kaynak: TÜİK, İstatistiklerle Yaşlılar 2025."],
["G","TÜİK · Yaşlılar","CIKAR","TÜİK «İstatistiklerle Yaşlılar 2025» bültenine göre dünyada yaşlı nüfus oranının en yüksek olduğu ülke hangisidir?","Monako|Türkiye|Nijer|Hindistan|Brezilya","En yüksek yaşlı nüfus oranı %36,0 ile Monako, %30,0 ile Japonya ve %25,1 ile İtalya'dadır. Türkiye 194 ülke arasında 75. sıradadır. Kaynak: TÜİK, İstatistiklerle Yaşlılar 2025."],
["G","TÜİK · Gençlik","CIKAR","TÜİK «İstatistiklerle Gençlik 2025» bültenine göre genç nüfusun (15–24 yaş) toplam nüfus içindeki oranı yüzde kaçtır?","%14,8|%20,8|%10,7|%15,6|%24,8","Genç nüfus 12.708.348 kişidir ve nüfusun %14,8'ini oluşturur. Oran 1950'de %20,8'di. AB ortalaması %10,7, dünya ortalaması %15,6'dır. Kaynak: TÜİK, İstatistiklerle Gençlik 2025 (Mayıs 2026)."],
["G","TÜİK · Gençlik","CIKAR","TÜİK verilerine göre 2025 yılında genç nüfus oranının en yüksek olduğu il hangisidir?","Şırnak|Balıkesir|Sinop|İzmir|Edirne","Genç nüfus oranı en yüksek il %20,4 ile Şırnak, en düşük il %11,7 ile Balıkesir'dir. Kaynak: TÜİK, İstatistiklerle Gençlik 2025."],
["G","TÜİK · Çocuk","COK","TÜİK «İstatistiklerle Çocuk 2025» bültenine göre çocuk nüfusun (0–17 yaş) toplam nüfus içindeki oranı yüzde kaçtır?","%24,8|%48,5|%41,8|%17,6|%11,1","Çocuk nüfus 21.375.930 kişidir ve nüfusun %24,8'ini oluşturur. Oran 1970'te %48,5, 1990'da %41,8 idi. AB ortalaması %17,6'dır. Kaynak: TÜİK, İstatistiklerle Çocuk 2025 (Nisan 2026)."],
["G","TÜİK · Çocuk","CIKAR","TÜİK verilerine göre 2025 yılında çocuk nüfus oranının en yüksek olduğu il hangisidir?","Şanlıurfa|Tunceli|Sinop|Balıkesir|Edirne","Çocuk nüfus oranı en yüksek il %43,3 ile Şanlıurfa, en düşük il %15,9 ile Tunceli'dir. Kaynak: TÜİK, İstatistiklerle Çocuk 2025."],
["G","TÜİK · Aile","CIKAR","TÜİK «İstatistiklerle Aile 2025» bültenine göre ortalama hanehalkı büyüklüğü kaç kişidir?","3,08|4,00|2,49|4,84|3,50","Ortalama hanehalkı büyüklüğü 2008'de 4 kişi iken 2025'te 3,08 kişiye düştü. En büyük haneler Şırnak'ta (4,84), en küçük haneler Tunceli'de (2,49). Kaynak: TÜİK, İstatistiklerle Aile 2025 (Mayıs 2026)."],
["G","TÜİK · Aile","CIKAR","TÜİK verilerine göre 2025 yılında tek kişilik hanelerin (yalnız yaşayanların) toplam haneler içindeki oranı yüzde kaçtır?","%20,5|%13,9|%5,2|%35,0|%50,1","Tek kişilik hanelerin oranı 2014'te %13,9 iken 2025'te %20,5'e çıktı; her 5 haneden birinde tek kişi yaşıyor. Toplam hane sayısı 26.977.795'tir. Kaynak: TÜİK, İstatistiklerle Aile 2025."],
["G","TÜİK · Yaşam Süresi","COK","TÜİK Hayat Tabloları 2023–2025'e göre Türkiye'de doğuşta beklenen yaşam süresi kaç yıldır?","78,5|78,1|75,9|81,1|72,0","Doğuşta beklenen yaşam süresi 78,5 yıl oldu (önceki dönem 78,1). Erkeklerde 75,9, kadınlarda 81,1 yıldır. Kaynak: TÜİK, Hayat Tabloları 2023–2025 (Temmuz 2026)."],
["G","TÜİK · Yaşam Süresi","CIKAR","TÜİK Hayat Tabloları 2023–2025'e göre kadın ve erkeklerin doğuşta beklenen yaşam süreleri için hangisi doğrudur?","Kadınlar erkeklerden yaklaşık 5,2 yıl daha uzun yaşamaktadır.|Erkekler kadınlardan yaklaşık 5,2 yıl daha uzun yaşamaktadır.|Kadın ve erkeklerin yaşam süreleri eşittir.|Kadınlar erkeklerden yaklaşık 10 yıl daha uzun yaşamaktadır.|Erkekler kadınlardan yaklaşık 2 yıl daha uzun yaşamaktadır.","Kadınlarda 81,1, erkeklerde 75,9 yıl; fark 5,2 yıldır. Kaynak: TÜİK, Hayat Tabloları 2023–2025."],
["G","TÜİK · Ölüm","COK","TÜİK Ölüm ve Ölüm Nedeni İstatistikleri 2025'e göre Türkiye'de en sık görülen ölüm nedeni hangisidir?","Dolaşım sistemi hastalıkları|İyi ve kötü huylu tümörler|Solunum sistemi hastalıkları|Trafik kazaları|Bulaşıcı hastalıklar","Ölümlerin %34,7'si dolaşım sistemi hastalıklarından kaynaklandı; onu tümörler (%16,1) ve solunum sistemi hastalıkları (%15,1) izledi. 2025'te 491.684 kişi öldü. Kaynak: TÜİK, Ölüm ve Ölüm Nedeni İstatistikleri 2025 (Haziran 2026)."],
["G","TÜİK · Ölüm","CIKAR","TÜİK verilerine göre 2025 yılında kaba ölüm hızının en yüksek olduğu il hangisidir?","Sinop|Şırnak|İstanbul|Şanlıurfa|Van","Kaba ölüm hızı en yüksek il binde 10,8 ile Sinop, en düşük il binde 2,3 ile Şırnak'tır. Sinop aynı zamanda yaşlı nüfus oranı en yüksek ildir. Kaynak: TÜİK, Ölüm ve Ölüm Nedeni İstatistikleri 2025."],
["G","TÜİK · Göç","CIKAR","TÜİK Uluslararası Göç İstatistikleri 2025'e göre Türkiye'ye göç eden yabancılar arasında ilk sırada hangi ülke vatandaşları yer almıştır?","Türkmenistan|Suriye|Irak|Almanya|İngiltere","Türkiye'ye gelen yabancıların %23,4'ü Türkmenistan vatandaşıdır; onu Azerbaycan (%8,3), Özbekistan (%6,9), Mısır ve Afganistan izler. Türkiye'den giden yabancılarda ilk sırada Irak (%15,7) vardır. Kaynak: TÜİK, Uluslararası Göç İstatistikleri 2025 (Haziran 2026)."],
["G","TÜİK · Ekonomi","CIKAR","TÜİK'in Ağustos 2026'da yayımladığı yıllık verilere göre Türkiye ekonomisi 2025 yılında yüzde kaç büyümüştür?","%3,7|%5,1|%1,2|%7,5|%0,5","Yıllık hesaplamaya göre büyüme %3,7, kişi başına GSYH 18.103 dolar oldu. Şubat 2026'daki ilk açıklamada büyüme %3,6 olarak verilmişti. Kaynak: TÜİK, Yıllık GSYH 2025."],
["G","TÜİK · Ekonomi","CIKAR","TÜİK verilerine göre 2025 yılında Türkiye'de kişi başına gayrisafi yurt içi hasıla (GSYH) yaklaşık kaç dolardır?","18 bin|10 bin|13 bin|25 bin|30 bin","Kişi başına GSYH 714.682 TL, dolar bazında 18.103 dolar oldu. Kaynak: TÜİK, Yıllık GSYH 2025 (Ağustos 2026)."],
["G","Ekonomi","COK","Türkiye'nin 2025 yılı ihracatı yaklaşık kaç milyar dolardır?","273,4|255,8|300,0|225,2|195,0","2025 ihracatı %4,5 artışla 273,4 milyar dolarla rekor kırdı; Aralık 2025'te 26,4 milyar dolarla aylık rekor görüldü. Kaynak: TİM / Ticaret Bakanlığı."],
["G","Ekonomi","COK","2025 yılında Türkiye'nin en çok ihracat yaptığı ülke hangisidir?","Almanya|Rusya|Çin|Irak|Japonya","Almanya'ya 19,8 milyar dolarlık ihracatla zirvedeki yerini korudu; onu Birleşik Krallık (14,2) ve ABD (13,2) izledi. Kaynak: TİM / AA."],
["G","Ekonomi","CIKAR","2025 yılında Türkiye'nin ihracatında ilk sırada yer alan sektör hangisidir?","Otomotiv|Kimyevi maddeler|Elektrik-elektronik|Hazır giyim|Fındık ve mamulleri","Otomotiv 41,5 milyar dolarla ihracat şampiyonu oldu; kimyevi maddeler (31,9) ikinci, elektrik-elektronik (17,7) üçüncü oldu. Kaynak: TİM."],
["G","TÜİK · İşgücü","CIKAR","TÜİK verilerine göre 2025 yılında Türkiye'de yıllık işsizlik oranı yüzde kaçtır?","%8,3|%10,4|%12,8|%6,1|%14,5","İşsiz sayısı 2.966.000 kişi, işsizlik oranı %8,3 oldu. Oran erkeklerde %6,8, kadınlarda %11,3; gençlerde (15–24) %15,3'tür. Kaynak: TÜİK, İşgücü İstatistikleri 2025 (Mart 2026)."],
["G","Turizm","CIKAR","Türkiye'nin 2025 yılı turizm geliri yaklaşık kaç milyar dolardır?","65,2|31,3|46,5|80,0|100,0","2025 turizm geliri 65,2 milyar dolar, toplam ziyaretçi sayısı yaklaşık 64 milyon oldu. Kaynak: Kültür ve Turizm Bakanlığı / TÜİK."],
["G","Turizm","COK","2025 yılında Türkiye'ye en çok turist gönderen ülke hangisidir?","Rusya|İran|Bulgaristan|İngiltere|ABD","Rusya 6,9 milyon ziyaretçiyle ilk sırada; onu Almanya (6,7 milyon), İngiltere (4,3 milyon), İran ve Bulgaristan izledi. Kaynak: Kültür ve Turizm Bakanlığı."],
["G","TÜİK · Bilişim","CIKAR","TÜİK Hanehalkı Bilişim Teknolojileri Kullanım Araştırması 2026'ya göre 16–74 yaş grubunda internet kullanım oranı yüzde kaçtır?","%92,3|%90,9|%75,0|%99,5|%60,2","İnternet kullanımı 2025'te %90,9 iken 2026'da %92,3'e çıktı; erkeklerde %94,8, kadınlarda %89,9'dur. Kaynak: TÜİK, Hanehalkı BT Kullanım Araştırması 2026 (Ağustos 2026)."],
["G","TÜİK · Bilişim","CIKAR","TÜİK 2026 verilerine göre bireylerin en çok kullandığı sosyal medya ve mesajlaşma uygulaması hangisidir?","WhatsApp|Facebook|X (Twitter)|Telegram|TikTok","WhatsApp %90 ile ilk sırada; onu YouTube (%77,6) ve Instagram (%71,1) izledi. Kaynak: TÜİK, Hanehalkı BT Kullanım Araştırması 2026."],
/* ================= GÜNCEL: 2026 olayları ================= */
["G","2026 Olayları","COK","2026 NATO Zirvesi hangi şehirde yapılmıştır?","Ankara|İstanbul|Lahey|Vilnius|Washington","36. NATO Zirvesi 7–8 Temmuz 2026'da Ankara'da, Cumhurbaşkanlığı Külliyesi'nde yapıldı. Türkiye'de 2004 İstanbul Zirvesi'nden sonra yapılan ikinci NATO zirvesidir. 2025 zirvesi Lahey'de, 2024 zirvesi Washington'da yapıldı."],
["G","2026 Olayları","COK","BM İklim Değişikliği 31. Taraflar Konferansı (COP31) hangi şehirde düzenlenmektedir?","Antalya|Bakü|Belém|Dubai|İstanbul","COP31, 9–20 Kasım 2026'da Antalya'da (EXPO alanı) yapılacak. COP28 Dubai (2023), COP29 Bakü (2024), COP30 Belém (Brezilya, 2025)'de yapıldı."],
["G","2026 Olayları","CIKAR","Türkiye'nin ev sahipliğindeki COP31'de müzakerelere başkanlık edecek ülke hangisidir?","Avustralya|Brezilya|Azerbaycan|Birleşik Arap Emirlikleri|Mısır","Kasım 2025'teki uzlaşıyla ev sahipliğini Türkiye, müzakere başkanlığını Avustralya üstlendi. COP31 Dönem Başkanı Çevre, Şehircilik ve İklim Değişikliği Bakanı Murat Kurum'dur."],
["G","2026 Olayları","CIKAR","2026 Kış Olimpiyat Oyunları hangi ülkede düzenlenmiştir?","İtalya (Milano-Cortina)|Çin (Pekin)|Güney Kore (Pyeongchang)|Rusya (Soçi)|Kanada (Vancouver)","Oyunlar 6–22 Şubat 2026'da Milano ve Cortina d'Ampezzo'da yapıldı. Pekin 2022, Pyeongchang 2018, Soçi 2014 kış olimpiyatlarına ev sahipliği yaptı."],

["G","2026 Olayları","CIKAR","TÜRKSOY tarafından 2026 yılı, doğumunun 150. yılı nedeniyle kimin anma yılı ilan edilmiştir?","Ziya Gökalp|Ali Şir Nevai|Cengiz Aytmatov|Kaşgarlı Mahmut|Nasreddin Hoca","Ziya Gökalp 1876'da Diyarbakır'da doğdu; «Türkçülüğün Esasları» eseriyle tanınır. Kültür ve Turizm Bakanlığının teklifi TÜRKSOY Daimî Konseyi'nde oy birliğiyle kabul edildi."],

["G","2026 Olayları","CIKAR","Ağustos 2026'da Cumhurbaşkanı Kararı ile ilan edilen deniz millî parkları hangileridir?","Fethiye-Kaş ve Kuzey Ege|Saros ve Gökova|İskenderun ve Mersin|Sinop ve Samsun|Marmara ve İstanbul Boğazı","Fethiye-Kaş (Muğla-Antalya) ve Kuzey Ege deniz millî parkları 16 Ağustos 2026 tarihli Resmî Gazete'de ilan edildi."],
["G","2026 Olayları","CIKAR","2026 Eurovision Şarkı Yarışması'nı hangi ülke kazanmıştır?","Bulgaristan|İsveç|İsrail|İtalya|Avusturya","Viyana'da yapılan yarışmayı Bulgaristan temsilcisi Dara «Bangaranga» şarkısıyla kazandı; Bulgaristan ilk kez birinci oldu. 2025'te Avusturya kazandığı için yarışma Viyana'da yapıldı."],

["G","Yıl Dönümleri","CIKAR","Malazgirt Zaferi'nin 2026 yılında kaçıncı yıl dönümü kutlanmıştır?","955|950|900|1000|925","Malazgirt Zaferi 1071'de kazanıldı: 2026 − 1071 = 955. Bursa'nın fethinin (1326) ise 700. yılıdır."],
["G","Yıl Dönümleri","CIKAR","29 Ekim 2026'da Cumhuriyet'in kaçıncı yılı kutlanacaktır?","103|100|102|104|105","Cumhuriyet 29 Ekim 1923'te ilan edildi: 2026 − 1923 = 103."],
["G","2025 Olayları","CIKAR","2025 yılında UNESCO Dünya Mirası Listesi'ne girerek Türkiye'nin listedeki alan sayısını 22'ye çıkaran yer hangisidir?","Sardes Antik Kenti ve Bin Tepeler Lidya Tümülüsleri (Manisa)|Gordion (Ankara)|Arslantepe Höyüğü (Malatya)|Göbeklitepe (Şanlıurfa)|Batı Anadolu'nun Ahşap Hipostil Camileri","Sardes, 12 Temmuz 2025'te Paris'teki 47. oturumda listeye girdi. Gordion ve Ahşap Hipostil Camiler 2023'te, Arslantepe 2021'de, Göbeklitepe 2018'de listeye alınmıştı. 2026'daki 48. oturumda Türkiye'den yeni alan eklenmedi."]
];

/* ---------- Durum ---------- */
const CARDS = RAW.map((r,i)=>({id:i,d:r[0],k:r[1],s:r[2],q:r[3],a:r[4],e:r[5],y:r[6]?r[6].split("|"):[]}));
/* Sınav soruları: şıklar sabit; doğru şık yazımda ilk sıradadır, sabit sıralı (I–V gibi) sorularda r[6] doğru şıkkın sırasıdır */
const TAGS={COK:["ÇOK ÇIKTI","tg-cok"],CIKTI:["ÇIKTI","tg-cikti"],CIKAR:["ÇIKAR","tg-cikar"]};
const EXAMS = SRAW.map((r,i)=>{const o=r[4].split("|"),fix=typeof r[6]==="number";return {id:"s"+i,d:r[0],k:r[1],t:r[2],q:r[3],a:fix?o[r[6]]:o[0],opts:fix?o:seeded(o,i*13+5),e:r[5],y:[],s:0}});
const store={get(k,f){try{const v=localStorage.getItem("kpssHap_"+k);return v==null?f:JSON.parse(v)}catch(e){return f}},set(k,v){try{localStorage.setItem("kpssHap_"+k,JSON.stringify(v))}catch(e){}}};
let mode=store.get("mode","card"), shuffled=store.get("shuf",false);
const fkey=()=>mode==="exam"?"filterX":"filter"; let filter=store.get(fkey(),"ALL");
let review=new Set(store.get("review",[])); let posMap=store.get("pos",{});
let list=[], idx=0, revealed=false, answered={}, scores={test:{ok:0,bad:0},exam:{ok:0,bad:0}}, score=scores[mode]||scores.test, optCache={};

const FILTERS=[["ALL","Tümü",null],["STAR","⭐ Çok çıkar",null],["REV","🔁 Tekrarım",null],["T",D.T,"--c-T"],["H",D.H,"--c-H"],["C",D.C,"--c-C"],["V",D.V,"--c-V"],["G",D.G,"--c-G"]];
const FILTERS_X=[["ALL","Tümü",null],["COK","🔥 Çok çıktı",null],["CIKTI","✅ Çıktı",null],["CIKAR","🎯 Çıkar",null],["REV","🔁 Tekrarım",null],["T",D.T,"--c-T"],["H",D.H,"--c-H"],["C",D.C,"--c-C"],["V",D.V,"--c-V"],["G",D.G,"--c-G"]];
const filters=()=>mode==="exam"?FILTERS_X:FILTERS, pool=()=>mode==="exam"?EXAMS:CARDS;
const match=(c,f)=>f==="ALL"||(f==="STAR"&&c.s)||(f==="REV"&&review.has(c.id))||(c.t!=null&&c.t===f)||c.d===f;
const pkey=()=>(mode==="exam"?"x":"")+filter+(shuffled?"s":"");
if(!filters().some(f=>f[0]===filter)) filter="ALL";
const $=s=>document.querySelector(s);
function seeded(arr,seed){const a=arr.slice();let s=seed;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
  let L=pool().filter(c=>match(c,filter));
  /* Sınav modunda çıktı / çok çıktı / çıkar soruları her zaman karışık gelir */
  if(shuffled) L=seeded(L,store.get("seed",7)); else if(mode==="exam") L=seeded(L,29);
  list=L; idx=Math.min(posMap[pkey()]||0,Math.max(0,list.length-1));
}
function counts(f){return pool().filter(c=>match(c,f)).length}
function renderChips(){
  $("#chips").innerHTML=filters().map(([k,l,col])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}" ${col?`style="--dot:var(${col})"`:""}>${col?"<i></i>":""}${l}<span class="n">${counts(k)}</span></button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.f;store.set(fkey(),filter);build();renderChips();render(0)});
  const on=$("#chips").querySelector('[aria-pressed="true"]'); if(on) on.scrollIntoView({inline:"nearest",block:"nearest"});
}
function options(c){
  if(c.opts) return c.opts;
  if(optCache[c.id]) return optCache[c.id];
  const pool=[...new Set(CARDS.filter(x=>x.d===c.d&&x.k===c.k&&x.a!==c.a).map(x=>x.a))];
  const more=[...new Set(CARDS.filter(x=>x.d===c.d&&x.k!==c.k&&x.a!==c.a).map(x=>x.a))];
  const pick=seeded(pool,c.id+3).slice(0,4); for(const m of seeded(more,c.id+11)){if(pick.length>=4)break;if(!pick.includes(m))pick.push(m)}
  const o=seeded([c.a,...pick],c.id*7+1); optCache[c.id]=o; return o;
}
function esc(s){return s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}
function cardHTML(c){
  const top=`<div class="card-top"><div class="tag" style="--subj:var(--c-${c.d})">${D[c.d]}<span>· ${esc(c.k)}</span></div>${c.t?`<span class="tg ${TAGS[c.t][1]}">${TAGS[c.t][0]}</span>`:c.s?'<span class="star">ÇOK ÇIKAR</span>':""}</div>`;
  const qh=`<div class="q${c.q.length>110?" long":""}">${esc(c.q).replace(/\n/g,"<br>")}</div>`;
  const back=`<div class="ans"><small>CEVAP</small>${esc(c.a)}</div><div class="exp">${esc(c.e)}</div>${c.y.length?`<div class="side"><h4>YAN SORULAR · BENZERLERİ</h4><ul>${c.y.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}`;
  if(mode==="card"){
    return top+`<div class="card-body">${qh}${revealed?back:`<div class="hint">Cevap için karta dokun · kaydırarak geç</div>`}</div>`;
  }
  const opts=options(c), st=answered[c.id];
  const L="ABCDE";
  return top+`<div class="card-body">${qh}<div class="opts">${opts.map((o,i)=>{let cls="";if(st!=null){if(o===c.a)cls="right";else if(i===st)cls="wrong"}return `<button class="opt ${cls}" data-i="${i}" ${st!=null?"disabled":""}><span class="b">${L[i]}</span><span>${esc(o)}</span></button>`}).join("")}</div>${st!=null?back.replace('<div class="ans"><small>CEVAP</small>'+esc(c.a)+'</div>',""):""}</div>`;
}
function render(dir){
  const stage=$("#stage");
  if(!list.length){stage.innerHTML=`<div class="empty">${filter==="REV"?"Tekrar listen boş.<br>Bir kartta 🔁 Tekrar'a basınca buraya eklenir.":"Bu filtrede kart yok."}</div>`;updBar();return}
  const c=list[idx]; const old=stage.querySelector(".card");
  const el=document.createElement("article"); el.className="card"; el.innerHTML=cardHTML(c);
  if(old&&dir){
    old.classList.add(dir>0?"out-up":"out-down");
    setTimeout(()=>old.remove(),280);
    el.classList.add("in"); el.style.transform=`translateY(${dir>0?"40px":"-40px"})`; el.style.opacity="0";
    stage.appendChild(el); requestAnimationFrame(()=>{requestAnimationFrame(()=>{el.classList.remove("in");el.style.transform="";el.style.opacity=""})});
  } else { stage.innerHTML=""; stage.appendChild(el) }
  el.querySelectorAll(".opt").forEach(b=>b.onclick=ev=>{ev.stopPropagation();answer(c,+b.dataset.i)});
  updBar();
}
function rerender(){const el=$("#stage .card");if(!el)return;el.innerHTML=cardHTML(list[idx]);el.querySelectorAll(".opt").forEach(b=>b.onclick=ev=>{ev.stopPropagation();answer(list[idx],+b.dataset.i)})}
function answer(c,i){if(answered[c.id]!=null)return;answered[c.id]=i;const ok=options(c)[i]===c.a;ok?score.ok++:score.bad++;if(!ok&&!review.has(c.id)){review.add(c.id);store.set("review",[...review]);renderChips()}rerender();updBar()}
function go(d){if(!list.length)return;const n=idx+d;if(n<0||n>=list.length)return;idx=n;revealed=false;posMap[pkey()]=idx;store.set("pos",posMap);render(d)}
function updBar(){
  const n=list.length; $("#count").textContent=n?`${idx+1} / ${n}`:"0 / 0";
  $("#prog").style.width=n?((idx+1)/n*100)+"%":"0";
  const c=list[idx]; $("#rev").setAttribute("aria-pressed",c&&review.has(c.id)?"true":"false");
  $("#score").innerHTML=mode!=="card"&&(score.ok+score.bad)?`Doğru <b>${score.ok}</b> · Yanlış <em>${score.bad}</em>`:(mode!=="card"?"Şıkka dokun":"");
  $("#prev").disabled=idx<=0; $("#next").disabled=idx>=n-1;
  $("#mCard").setAttribute("aria-pressed",mode==="card"); $("#mTest").setAttribute("aria-pressed",mode==="test"); $("#mExam").setAttribute("aria-pressed",mode==="exam");
  $("#shuf").setAttribute("aria-pressed",shuffled); $("#shuf").style.background=shuffled?"var(--fg)":""; $("#shuf").style.color=shuffled?"var(--bg)":"";
}
/* ---------- Dokunma / kaydırma ---------- */
let sx=0,sy=0,st=0,moved=false;
const stage=$("#stage");
stage.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;st=Date.now();moved=false});
stage.addEventListener("pointerup",e=>{
  const dx=e.clientX-sx, dy=e.clientY-sy, ax=Math.abs(dx), ay=Math.abs(dy);
  if(Math.max(ax,ay)>45){ if(ay>ax) go(dy<0?1:-1); else go(dx<0?1:-1); return }
  if(e.target.closest(".opt"))return;
  if(mode==="card"&&Date.now()-st<500){revealed=!revealed;rerender()}
});
/* Kart içi uzun içerik: içerik kaydırılabiliyorsa dikey kaydırmayı içeriğe bırak */
stage.addEventListener("touchmove",e=>{const b=e.target.closest(".card-body");if(b&&b.scrollHeight>b.clientHeight+4){stage.style.touchAction="pan-y"}},{passive:true});
stage.addEventListener("touchend",()=>{stage.style.touchAction="none"});
stage.addEventListener("wheel",e=>{const b=e.target.closest(".card-body");if(b&&b.scrollHeight>b.clientHeight+4)return;if(Math.abs(e.deltaY)>30){e.preventDefault();wheelGo(e.deltaY>0?1:-1)}},{passive:false});
let wl=0;function wheelGo(d){const t=Date.now();if(t-wl<450)return;wl=t;go(d)}
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="ArrowRight"||e.key==="j")go(1);
  else if(e.key==="ArrowUp"||e.key==="ArrowLeft"||e.key==="k")go(-1);
  else if(e.key===" "||e.key==="Enter"){if(mode==="card"){e.preventDefault();revealed=!revealed;rerender()}}
  else if(mode!=="card"&&/^[a-eA-E1-5]$/.test(e.key)){const i=/\d/.test(e.key)?+e.key-1:"abcde".indexOf(e.key.toLowerCase());if(list[idx])answer(list[idx],i)}
});
$("#next").onclick=()=>go(1); $("#prev").onclick=()=>go(-1);
$("#rev").onclick=()=>{const c=list[idx];if(!c)return;review.has(c.id)?review.delete(c.id):review.add(c.id);store.set("review",[...review]);renderChips();updBar()};
$("#shuf").onclick=()=>{shuffled=!shuffled;if(shuffled)store.set("seed",Math.floor(Math.random()*9999)+1);store.set("shuf",shuffled);build();render(0)};
function setMode(m){const pool0=pool();mode=m;store.set("mode",mode);revealed=false;score=scores[m]||score;
  if(pool()!==pool0){filter=store.get(fkey(),"ALL");if(!filters().some(f=>f[0]===filter))filter="ALL";build();renderChips()}
  render(0)}
$("#mCard").onclick=()=>setMode("card");
$("#mTest").onclick=()=>setMode("test");
$("#mExam").onclick=()=>setMode("exam");
/* Geri sayım */
(function(){const ex=new Date("2026-10-25T10:15:00+03:00");const d=Math.ceil((ex-new Date())/864e5);$("#sub").textContent=d>0?`SINAVA ${d} GÜN · 25 EKİM 10.15`:"25 EKİM PAZAR · 10.15 · BOL ŞANS"})();
build(); renderChips(); render(0);
</script>
